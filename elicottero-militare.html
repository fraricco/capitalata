<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eli-Militare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #243024; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
  #gl, #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud { pointer-events: none; z-index: 2; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,16,10,0.72); padding: 16px; z-index: 10; }
  #overlay.hidden { display: none; }
  .panel { background: rgba(26,38,26,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.22); border-radius: 16px; padding: 24px 26px; max-width: 640px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.45); max-height: 100%; overflow: auto; }
  .panel h1 { font-size: 2.1rem; margin-bottom: 6px; }
  .panel h2 { font-size: 1.6rem; margin-bottom: 10px; }
  .panel p { opacity: 0.92; line-height: 1.5; margin-bottom: 12px; }
  .biomes { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 12px 0; }
  .bio { border: 2px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.07); color: #fff; border-radius: 10px; padding: 10px 6px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
  .bio .e { font-size: 1.8rem; display: block; }
  .bio:hover { border-color: #ffb347; background: rgba(255,179,71,0.16); }

  kbd { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 0.85em; }
  button.big { background: #ffb347; color: #1e2a1e; font-weight: 700; font-size: 1.1rem; border: none; border-radius: 10px; padding: 12px 28px; cursor: pointer; margin: 4px; }
  button.big:hover { filter: brightness(1.08); }
  a.back { color: #fff; opacity: 0.7; display: inline-block; margin-top: 8px; font-size: 0.9rem; }
  table.sc { margin: 8px auto 14px; text-align: left; border-collapse: collapse; }
  table.sc td { padding: 3px 12px; } table.sc td:last-child { text-align: right; font-weight: 700; color: #ffd166; }
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  body.touch #touch { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
  .tb.p { background: rgba(255,179,71,0.6); }
  #bL { left: 12px; bottom: 28px; } #bR { left: 86px; bottom: 28px; }
  #bC { left: 12px; bottom: 100px; font-size: 0.75rem; } #bF { left: 86px; bottom: 100px; font-size: 0.75rem; }
  #bU { right: 86px; bottom: 28px; } #bD { right: 12px; bottom: 28px; }
  #bA { right: 12px; bottom: 100px; width: 80px; height: 80px; font-size: 0.75rem; font-weight: 700; background: rgba(46,160,67,0.55); }
  #bX { right: 100px; bottom: 100px; font-size: 0.7rem; font-weight: 700; background: rgba(255,120,40,0.55); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div class="tb" id="bL" data-k="left">◀</div><div class="tb" id="bR" data-k="right">▶</div>
  <div class="tb" id="bC" data-k="climb">SALI</div><div class="tb" id="bF" data-k="descend">SCENDI</div>
  <div class="tb" id="bU" data-k="up">▲</div><div class="tb" id="bD" data-k="down">▼</div>
  <div class="tb" id="bX" data-k="flare">FLARE</div>
  <div class="tb" id="bA" data-k="act">ATTERRA<br>/ DECOLLA</div>
</div>
<div id="overlay"><div class="panel" id="panel"><h2>Caricamento…</h2></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const glc = document.getElementById('gl'), hudc = document.getElementById('hud');
const ctx = hudc.getContext('2d');
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
if (typeof THREE === 'undefined') { panel.innerHTML = '<h2>Errore</h2><p>Impossibile caricare la libreria 3D. Controlla la connessione e ricarica la pagina.</p>'; return; }

// ---------- utilità ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeNoise(seed) {
  const r = mulberry(seed), P = new Uint8Array(512), perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  const val = (x, z) => P[(P[x & 255] + z) & 255] / 127.5 - 1;
  const n2 = (x, z) => {
    const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    return lerp(lerp(val(xi, zi), val(xi + 1, zi), u), lerp(val(xi, zi + 1), val(xi + 1, zi + 1), u), v);
  };
  return (x, z, oct = 4) => { let a = 1, f = 1, s = 0, n = 0; for (let i = 0; i < oct; i++) { s += n2(x * f, z * f) * a; n += a; a *= 0.5; f *= 2; } return s / n; };
}

// ---------- mondo ----------
const W = 6400, G = 200, CELL = W / G;
const HR = 26, CEIL = 900, CLEAR = 14;

// ---------- ambienti ----------
const BIOMES = {
  desert: { id: 'desert', name: 'Deserto', icon: '🏜️', op: 'Operazione Miraggio', obj: 'distruggere la stazione radar', sky: '#ebcf9c', fog: '#e8cfa0', fogN: 900, fogF: 3900, hemiS: '#fff2d8', hemiG: '#c9a468', sun: '#fff0cc', heli: '#9a8458', camo: { u: '#b8a074', v: '#7e6c48', h: '#8c7a54', p: '#6e5e3e' }, enemy: { u: '#5b5a4a', v: '#3e3d33', h: '#2f2f28', p: '#2c2c26' }, part: 'dust', water: null, structure: 'radar' },
  arctic: { id: 'arctic', name: 'Artico', icon: '❄️', op: 'Operazione Aurora Gelida', obj: 'distruggere il deposito carburante', sky: '#cfe3f2', fog: '#e1ecf3', fogN: 600, fogF: 3300, hemiS: '#e8f4ff', hemiG: '#9fb4c4', sun: '#f4f8ff', heli: '#dfe6eb', camo: { u: '#e8eef2', v: '#9fb1bd', h: '#cfd9df', p: '#aebcc6' }, enemy: { u: '#4a5560', v: '#2f3841', h: '#272e36', p: '#232a31' }, part: 'snow', water: '#46738f', structure: 'fuel' },
  jungle: { id: 'jungle', name: 'Foresta pluviale', icon: '🌴', op: 'Operazione Liana', obj: 'neutralizzare il campo ribelle', sky: '#9ec3aa', fog: '#8fb39b', fogN: 500, fogF: 2700, hemiS: '#d6f0d8', hemiG: '#3c5a34', sun: '#fff6d8', heli: '#4c5a38', camo: { u: '#4f6a3a', v: '#33472a', h: '#3d5430', p: '#2f4023' }, enemy: { u: '#6b5a44', v: '#40362a', h: '#3a3026', p: '#2a231b' }, part: 'none', water: '#3d6b73', structure: 'camp' },
  volcano: { id: 'volcano', name: 'Vulcano', icon: '🌋', op: 'Operazione Magma', obj: 'recuperare i dati dal laboratorio', sky: '#59403a', fog: '#573b34', fogN: 500, fogF: 3000, hemiS: '#ffc9a0', hemiG: '#43302c', sun: '#ffb27a', heli: '#3a3d40', camo: { u: '#3f4448', v: '#2a2e31', h: '#34383b', p: '#25282a' }, enemy: { u: '#6a2a24', v: '#3f1a16', h: '#2e1411', p: '#241210' }, part: 'ash', water: '#ff5a1c', structure: 'lab' },
  ruins: { id: 'ruins', name: 'Città in rovina', icon: '🏚️', op: 'Operazione Fenice', obj: 'distruggere la torre di comunicazione', sky: '#a9b3ba', fog: '#aab3b9', fogN: 700, fogF: 3500, hemiS: '#e8eef2', hemiG: '#6a6c66', sun: '#fff4e4', heli: '#5d6455', camo: { u: '#6b7260', v: '#494f40', h: '#565d4a', p: '#3d4234' }, enemy: { u: '#4a4d52', v: '#2d2f33', h: '#232528', p: '#1e1f22' }, part: 'ash', water: null, structure: 'tower' }
};
const ORDER = ['desert', 'arctic', 'jungle', 'volcano', 'ruins'];

// ---------- stato ----------
let mode = 'loading', level = 1, totalScore = 0, campaign = true;
let M = null;               // missione corrente
let heli = null, game = null;
let vw = 800, vh = 600, tAnim = 0, shake = 0, toastMsg = '', toastT = 0, warnT = 0, warnMsg = '';
const keys = { left: false, right: false, up: false, down: false, climb: false, descend: false };

const keymap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'climb', ShiftRight: 'climb', KeyR: 'climb', KeyE: 'climb', ControlLeft: 'descend', ControlRight: 'descend', KeyF: 'descend', KeyQ: 'descend' };
addEventListener('keydown', e => {
  initAudio();
  if (e.code === 'Enter' || e.code === 'KeyL') { e.preventDefault(); if (!e.repeat) action(); return; }
  if (e.code === 'KeyX') { e.preventDefault(); if (!e.repeat) fireFlares(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (mode === 'pause') { if (!e.repeat) togglePause(); return; }
    if (mode === 'play') { keys.climb = true; if (!e.repeat && heli.state === 'landed') action(); }
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) togglePause(); return; }
  const k = keymap[e.code]; if (k) { keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') keys.climb = false; const k = keymap[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); initAudio(); b.classList.add('p'); if (k === 'act') action(); else if (k === 'flare') fireFlares(); else keys[k] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('p'); if (k !== 'act' && k !== 'flare') keys[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
const isMobile = document.body.classList.contains('touch');
function toast(m, t = 2.6) { toastMsg = m; toastT = t; }
function warn(m, t = 2.2) { warnMsg = m; warnT = t; }

// ---------- audio (sintetico) ----------
let AC = null, noiseBuf = null;
function initAudio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate * 1; noiseBuf = AC.createBuffer(1, n, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } catch (e) { AC = null; } }
function beep(f, dur = 0.12, vol = 0.05, type = 'square') { if (!AC) return; try { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.value = vol; o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur); o.stop(AC.currentTime + dur); } catch (e) {} }
function boom(vol = 0.18, dur = 0.7, lp = 600) { if (!AC || !noiseBuf) return; try { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur); s.stop(AC.currentTime + dur); } catch (e) {} }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(62, 1, 2, 9000);
let camYaw = 0, menuAng = 0;
const matCache = {};
const LM = c => matCache[c] || (matCache[c] = new THREE.MeshLambertMaterial({ color: c }));
const PM = (c, o) => new THREE.MeshPhongMaterial(Object.assign({ color: c, shininess: 30 }, o || {}));
const BM = (c, o) => new THREE.MeshBasicMaterial(Object.assign({ color: c }, o || {}));

// ---------- modelli: soldato ----------
function makeSoldier(camo, scale = 1.25) {
  const g = new THREE.Group(), j = {};
  const uni = LM(camo.u), vest = LM(camo.v), helm = LM(camo.h), pack = LM(camo.p), skin = LM('#e0b48c'), dark = LM('#26282a'), boot = LM('#17181a');
  const box = (w, h, d, mat, x, y, z, parent) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; (parent || g).add(m); return m; };
  const pelvis = new THREE.Group(); pelvis.position.y = 9.2; g.add(pelvis); j.pelvis = pelvis;
  box(6, 3, 3.6, uni, 0, 0.2, 0, pelvis);
  const torso = new THREE.Group(); torso.position.y = 1.6; pelvis.add(torso); j.torso = torso;
  box(6.6, 7, 3.8, uni, 0, 3.5, 0, torso);
  box(7, 5, 4.4, vest, 0, 4, 0.1, torso);                         // giubbotto
  box(1.8, 2.4, 1, dark, -1.8, 3, 2.5, torso); box(1.8, 2.4, 1, dark, 1.8, 3, 2.5, torso);   // tasche
  box(5.4, 6.4, 2.6, pack, 0, 4.2, -3.4, torso);                  // zaino
  const neck = box(2, 1.2, 2, skin, 0, 7.4, 0, torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 10), skin); head.position.set(0, 9.2, 0); head.castShadow = true; torso.add(head); j.head = head;
  const hm = new THREE.Mesh(new THREE.SphereGeometry(2.7, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), helm); hm.position.set(0, 9.6, 0); hm.castShadow = true; torso.add(hm);
  box(3.2, 0.6, 1.4, dark, 0, 9.5, 2.3, torso);                   // visore/NVG
  // braccia
  const arm = side => {
    const sh = new THREE.Group(); sh.position.set(side * 4.2, 6.4, 0); torso.add(sh);
    box(1.9, 4, 2, uni, 0, -2, 0, sh);
    const el = new THREE.Group(); el.position.y = -4; sh.add(el);
    box(1.7, 3.8, 1.8, uni, 0, -1.9, 0, el); box(1.8, 1.2, 1.9, dark, 0, -4.2, 0, el);
    return { sh, el };
  };
  j.armL = arm(-1); j.armR = arm(1);
  // fucile
  const rifle = new THREE.Group(); rifle.position.set(0.5, -3.2, 2.6); j.armR.el.add(rifle); j.rifle = rifle;
  box(1, 1.4, 8, dark, 0, 0, 1.5, rifle); box(0.6, 0.6, 5, dark, 0, 0.2, 7, rifle); box(1, 1.4, 1.6, dark, 0, -1.4, 0.6, rifle);
  const flash = new THREE.Mesh(new THREE.ConeGeometry(1.3, 4, 6).rotateX(Math.PI / 2), BM('#ffd35a', { transparent: true, opacity: 0.95 })); flash.position.set(0, 0.2, 11); flash.visible = false; rifle.add(flash); j.flash = flash;
  // gambe
  const leg = side => {
    const hp = new THREE.Group(); hp.position.set(side * 1.7, -1, 0); pelvis.add(hp);
    box(2.5, 4.4, 2.8, uni, 0, -2.2, 0, hp);
    const kn = new THREE.Group(); kn.position.y = -4.4; hp.add(kn);
    box(2.3, 4.2, 2.5, uni, 0, -2.1, 0, kn); box(2.5, 1.6, 4.2, boot, 0, -4.4, 0.7, kn);
    box(2.7, 1.8, 2.8, vest, 0, 0, 0.1, kn);                      // ginocchiera
    return { hp, kn };
  };
  j.legL = leg(-1); j.legR = leg(1);
  g.scale.setScalar(scale); g.userData = { j, ph: Math.random() * 6, pose: 'stand' };
  setPose(g, 'stand', 0);
  return g;
}
// pose / animazioni
function setPose(g, pose, spd, dt = 0.016, aim = false) {
  const u = g.userData, j = u.j; u.pose = pose;
  if (pose === 'run') {
    u.ph += dt * spd * 0.2; const s = Math.sin(u.ph), c = Math.cos(u.ph);
    j.legL.hp.rotation.x = s * 1.0; j.legR.hp.rotation.x = -s * 1.0;
    j.legL.kn.rotation.x = Math.max(0, -s) * 1.3; j.legR.kn.rotation.x = Math.max(0, s) * 1.3;
    j.armL.sh.rotation.x = -0.5 + c * 0.35; j.armL.el.rotation.x = -0.9; j.armR.sh.rotation.x = -0.9; j.armR.el.rotation.x = -0.5;
    j.torso.rotation.x = 0.18; j.pelvis.position.y = 9.2 + Math.abs(c) * 0.5; j.pelvis.rotation.x = 0;
  } else if (pose === 'kneel') {
    j.legL.hp.rotation.x = -1.3; j.legL.kn.rotation.x = 1.5; j.legR.hp.rotation.x = -0.2; j.legR.kn.rotation.x = 1.9;
    j.pelvis.position.y = 5.6; j.torso.rotation.x = 0.05;
    j.armL.sh.rotation.x = -1.35; j.armL.el.rotation.x = -0.2; j.armR.sh.rotation.x = -1.3; j.armR.el.rotation.x = -0.6;
  } else if (pose === 'salute') {
    j.legL.hp.rotation.x = j.legR.hp.rotation.x = 0; j.legL.kn.rotation.x = j.legR.kn.rotation.x = 0; j.pelvis.position.y = 9.2; j.torso.rotation.x = 0;
    j.armR.sh.rotation.x = -2.6; j.armR.el.rotation.x = -1.9; j.armL.sh.rotation.x = 0.05; j.armL.el.rotation.x = -0.1;
  } else if (pose === 'dead') {
    g.rotation.x = -Math.PI / 2; g.position.y = 3;
  } else { // stand (con respiro)
    u.ph += dt * 1.6; j.legL.hp.rotation.x = j.legR.hp.rotation.x = 0; j.legL.kn.rotation.x = j.legR.kn.rotation.x = 0; j.pelvis.position.y = 9.2 + Math.sin(u.ph) * 0.1;
    j.torso.rotation.x = 0; j.torso.rotation.y = Math.sin(u.ph * 0.4) * 0.35;
    j.armL.sh.rotation.x = -0.9; j.armL.el.rotation.x = -0.8; j.armR.sh.rotation.x = -0.9; j.armR.el.rotation.x = -0.5;
  }
  if (aim && pose !== 'dead') { j.armR.sh.rotation.x = -1.5; j.armR.el.rotation.x = -0.15; j.armL.sh.rotation.x = -1.45; j.armL.el.rotation.x = -0.2; }
  if (pose !== 'stand') j.torso.rotation.y = 0;
}

// ---------- modelli: elicottero, caccia, strutture ----------
function makeHeli(color) {
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner);
  const body = PM(color), dk = PM('#2c3032'), gl = PM('#35556b', { transparent: true, opacity: 0.85, shininess: 120 });
  const add = (geo, mat, x, y, z, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; (parent || inner).add(m); return m; };
  const fus = add(new THREE.SphereGeometry(1, 20, 14), body, 0, 0, 2); fus.scale.set(12, 10.5, 25);
  add(new THREE.BoxGeometry(14, 3, 14), body, 0, -5, 4);                                  // pancia
  const nose = add(new THREE.SphereGeometry(1, 14, 10), gl, 0, 1.5, -13); nose.scale.set(8.8, 7, 9);
  add(new THREE.BoxGeometry(1, 5, 12), dk, 11.6, 0, 6); add(new THREE.BoxGeometry(1, 5, 12), dk, -11.6, 0, 6);  // portelloni aperti
  add(new THREE.CylinderGeometry(0.7, 0.7, 12, 6).rotateX(Math.PI / 2), dk, 14, 1.5, 4);  // mitragliatrice
  add(new THREE.BoxGeometry(2, 2, 3), dk, 12.6, 0, 5);
  const boom = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 3, 36, 8).rotateX(Math.PI / 2), body); boom.position.set(0, 2, 38); boom.castShadow = true; inner.add(boom);
  add(new THREE.BoxGeometry(1.3, 15, 9), body, 0, 8, 54); add(new THREE.BoxGeometry(14, 1, 5), body, 0, 3, 52);
  const tail = new THREE.Group(); tail.position.set(2.8, 8, 55); inner.add(tail);
  add(new THREE.BoxGeometry(0.6, 13, 1.5), dk, 0, 0, 0, tail); add(new THREE.BoxGeometry(0.6, 1.5, 13), dk, 0, 0, 0, tail);
  // ali tozze con razzi

function collide() {

  // pendio: controllo anteriore
  for (const c of gridGet(M.cGrid, h.x - HR - 30, h.x + HR + 30, h.z - HR - 30, h.z + HR + 30)) {
    if (hb >= c.top) continue;
    const dx = h.x - c.x, dz = h.z - c.z, rr = HR * 0.8 + c.r, d = Math.hypot(dx, dz);

  for (const b of gridGet(M.bGrid, h.x - HR - 20, h.x + HR + 20, h.z - HR - 20, h.z + HR + 20)) {

    if (d2 < HR * HR) { const d = Math.sqrt(d2); if (d > 0.01) bump(dx / d, dz / d, HR - d, 4, 'Edificio'); else bump(1, 0, HR, 4, 'Edificio'); }

function hurtGround(imp) { if (heli.inv > 0) return; heli.hull -= Math.min(30, imp * 0.1); heli.inv = 0.8; shake = 0.4; toast('Impatto col suolo!', 1.2); if (heli.hull <= 0) { heli.hull = 0; endGame(false, 'L\'elicottero si è schiantato 💥'); } }

}

// ---------- aggiornamento scena ----------
function updateScene(dt) {
  const h = heli, O = SC, b = M.b;
  O.heli.position.set(h.x, h.y, h.z); O.heli.rotation.set(0, -h.a, 0);
  O.heli.userData.inner.rotation.set(h.pitch, 0, -h.roll, 'YXZ'); O.heli.userData.rotor.rotation.y = h.rotS; O.heli.userData.tail.rotation.x = h.rotS * 1.4;
  O.heli.visible = !(h.inv > 0 && h.inv < 0.8 && Math.floor(h.inv * 14) % 2 && h.inv > 0.15);
  O.sun.position.set(h.x + 420, 900, h.z + 300); O.sun.target.position.set(h.x, 0, h.z);
  O.flag.rotation.y = Math.sin(tAnim * 3) * 0.3;
  if (O.struct.userData.spin) O.struct.userData.spin.rotation.y += dt * 1.2;
  // fumo di segnalazione
  O.smoke.forEach(m => { const ph = (tAnim * 0.3 + m.userData.ph) % 1; m.position.set(M.lz.x + 60 + Math.sin(ph * 5 + m.userData.ph * 9) * 8, M.lz.h + ph * 120, M.lz.z + 30); m.scale.setScalar(0.5 + ph * 1.8); m.material.opacity = 0.6 * (1 - ph); m.visible = mode !== 'menu'; });

  const tg = (game.phase === 'toBase' || game.phase === 'dropBase') ? M.base : M.lz;
  const show = mode !== 'menu' && ['toLZ', 'toBase', 'regroup'].includes(game.phase);
  O.beam.visible = O.ring.visible = show;
  O.beam.position.set(tg.x, tg.h + 550, tg.z); O.ring.position.set(tg.x, tg.h + 1.4, tg.z);
  const colr = tg === M.base ? '#7dff9a' : '#ffe066'; O.beam.material.color.set(colr); O.ring.material.color.set(colr);
  O.beam.material.opacity = 0.22 + 0.12 * Math.sin(tAnim * 4); O.ring.scale.setScalar(1 + 0.07 * Math.sin(tAnim * 5));
  // lava che pulsa
  if (O.water && b.id === 'volcano') O.water.material.color.setHSL(0.045 + 0.01 * Math.sin(tAnim * 2), 1, 0.52 + 0.05 * Math.sin(tAnim * 3));

  }
  // camera
  if (mode === 'menu') { const R = 300, cx = M.base.x, cz = M.base.z; camera.position.set(cx + Math.sin(menuAng) * R, M.base.h + 120, cz + Math.cos(menuAng) * R); camera.lookAt(cx, M.base.h + 25, cz); }
  else {
    camYaw += angDiff(camYaw, h.a) * Math.min(1, 2.6 * dt);
    let sx = 0, sy = 0; if (shake > 0) { sx = rand(-4, 4) * shake * 2; sy = rand(-4, 4) * shake * 2; }
    const cx = h.x - Math.sin(camYaw) * 160 + sx, cz = h.z + Math.cos(camYaw) * 160; let cy = h.y + 62 + sy;

  }
}

// ---------- HUD ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function bar(x, y, w, h, f, col, label) {
  ctx.fillStyle = 'rgba(255,255,255,.2)'; rr(x, y, w, h, 6); ctx.fill(); ctx.fillStyle = col; rr(x, y, Math.max(h, w * clamp(f, 0, 1)), h, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(label, x, y + h + 11);
}
function drawHUD() {
  ctx.clearRect(0, 0, vw, vh);

  const pad = 12, h = heli; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(8,16,8,.62)'; rr(pad, pad, 244, 128, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`${M.b.icon} ${M.b.name} · Liv. ${level}   ⭐ ${totalScore}`, pad + 12, pad + 22);
  bar(pad + 12, pad + 34, 220, 12, h.hull / 100, h.hull > 50 ? '#4cd964' : h.hull > 25 ? '#ffcc00' : '#ff3b30', '🔧 Corazza');
  ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif';
  ctx.fillText(`🪖 Squadra a bordo: ${game.aboard}/${M.squad.length}`, pad + 12, pad + 78);
  let fl = '🔥 Razzi (X): '; for (let i = 0; i < 8; i++) fl += i < game.flares ? '●' : '○'; ctx.fillText(fl, pad + 12, pad + 98);
  if (['assault'].includes(game.phase)) bar(pad + 12, pad + 108, 220, 8, M.objHP, '#ff6a3a', ''); else { ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.font = '11px sans-serif'; ctx.fillText(`Tempo ${Math.round(game.t)}s · colpi subiti ${game.hits}`, pad + 12, pad + 116); }
  // obiettivo
  const obj = { board: '🪖 La squadra sale a bordo…', toLZ: `🎯 ${M.b.op}: vola alla zona di sbarco`, drop: '🪂 Sbarco della squadra…', assault: `💥 Squadra all'attacco: ${M.b.obj}!`, regroup: '🚁 Obiettivo distrutto! Atterra sul punto di recupero', pickup: '🪖 Recupero della squadra…', toBase: '🏠 Riporta la squadra alla base', dropBase: '🎖️ Squadra a casa!' }[game.phase];
  ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; const tw = Math.min(vw - 330, ctx.measureText(obj).width + 28);
  ctx.fillStyle = 'rgba(8,16,8,.62)'; rr(vw / 2 - tw / 2, pad, tw, 32, 16); ctx.fill(); ctx.fillStyle = '#ffd166'; ctx.fillText(obj, vw / 2, pad + 21, tw - 20);

  const cx = vw / 2, cy = pad + 82;
  ctx.fillStyle = 'rgba(8,16,8,.62)'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rel); ctx.fillStyle = tg === M.base ? '#7dff9a' : '#ffe066'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-12, 12); ctx.lineTo(0, 6); ctx.lineTo(12, 12); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(Math.round(dist / 4) + ' m', cx, cy + 46);
  // allarmi
  if (warnT > 0) { ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = Math.floor(tAnim * 6) % 2 ? '#ff4030' : '#ffd0c8'; ctx.fillText(warnMsg, vw / 2, vh * 0.3); }
  if (toastT > 0) { ctx.font = 'bold 16px sans-serif'; const w2 = Math.min(vw - 20, ctx.measureText(toastMsg).width + 34); ctx.globalAlpha = Math.min(1, toastT * 2); ctx.fillStyle = 'rgba(0,0,0,.72)'; rr(vw / 2 - w2 / 2, vh * 0.2, w2, 34, 17); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(toastMsg, vw / 2, vh * 0.2 + 22, w2 - 20); ctx.globalAlpha = 1; }
  const sp = Math.hypot(h.vx, h.vz); ctx.textAlign = 'center'; ctx.font = 'bold 18px sans-serif';
  if (h.state === 'fly') { const near = [M.base, M.lz].find(padOf); if (near) { const ok = sp <= 90; ctx.fillStyle = ok ? '#7dff9a' : '#ffb347'; ctx.fillText(ok ? 'Premi L per atterrare' : 'Rallenta per atterrare… (' + Math.round(sp) + ')', vw / 2, vh - 130); } }
  else if (h.state === 'landed' && !['board', 'drop', 'pickup', 'dropBase'].includes(game.phase)) { ctx.fillStyle = '#7dff9a'; ctx.fillText('SPAZIO per decollare', vw / 2, vh - 130); }
  const tb = isMobile ? 190 : 24; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText(`Velocità ${Math.round(sp / 4 * 3.6)} km/h`, pad, vh - tb); ctx.fillText(`Quota ${Math.max(0, Math.round((h.y - groundAt(h.x, h.z)) / 4))} m`, pad, vh - tb - 18);
  // radar (relativo all'elicottero)
  const R = 72, rx = vw - R - pad - 4, ry = R + pad + 4, range = 2200;
  ctx.fillStyle = 'rgba(6,24,10,.72)'; ctx.beginPath(); ctx.arc(rx, ry, R + 4, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(120,255,150,.5)'; ctx.lineWidth = 1;
  for (const rad of [R, R * 0.66, R * 0.33]) { ctx.beginPath(); ctx.arc(rx, ry, rad, 0, 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(rx - R, ry); ctx.lineTo(rx + R, ry); ctx.moveTo(rx, ry - R); ctx.lineTo(rx, ry + R); ctx.stroke();
  const blip = (x, z, col, r, sq) => { const ddx = x - h.x, ddz = z - h.z, a = -h.a, rx2 = ddx * Math.cos(a) - ddz * Math.sin(a), rz2 = ddx * Math.sin(a) + ddz * Math.cos(a); let px = rx2 / range * R, pz = rz2 / range * R; const l = Math.hypot(px, pz); if (l > R - 3) { px *= (R - 3) / l; pz *= (R - 3) / l; } ctx.fillStyle = col; if (sq) ctx.fillRect(rx + px - r, ry + pz - r, r * 2, r * 2); else { ctx.beginPath(); ctx.arc(rx + px, ry + pz, r, 0, 7); ctx.fill(); } };
  blip(M.base.x, M.base.z, '#7dff9a', 4, true); blip(M.lz.x, M.lz.z, '#ffe066', 4, true);

  for (const j of M.jets) blip(j.x, j.z, '#ff2a2a', 5); for (const q of M.missiles) blip(q.x, q.z, '#ffa030', 3);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(rx, ry - 7); ctx.lineTo(rx - 5, ry + 5); ctx.lineTo(rx + 5, ry + 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('RADAR', rx, ry + R + 16);
  // indicatore caccia fuori schermo
  for (const j of M.jets) { const rel2 = Math.atan2(j.x - h.x, -(j.z - h.z)) - h.a, d2 = Math.hypot(j.x - h.x, j.z - h.z); if (d2 > 1500) continue; const a2 = angDiff(0, rel2); if (Math.abs(a2) < 0.9) continue; ctx.save(); ctx.translate(vw / 2 + Math.sin(a2) * Math.min(vw * 0.42, 380), vh / 2 - Math.cos(a2) * Math.min(vh * 0.36, 250)); ctx.rotate(a2); ctx.fillStyle = 'rgba(255,50,40,.9)'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-10, 8); ctx.lineTo(10, 8); ctx.closePath(); ctx.fill(); ctx.restore(); }
  // vignettatura rossa quando in pericolo
  if (h.hull < 30) { const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.35, vw / 2, vh / 2, vh * 0.8); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${0.35 + 0.15 * Math.sin(tAnim * 6)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh); }
}

// ---------- ciclo ----------
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(vw, vh, false); hudc.width = vw * dpr; hudc.height = vh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = vw / vh; camera.fov = vw / vh < 1 ? 75 : 62; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (M && SC && heli) { update(dt); updateScene(dt); renderer.render(SC.sc, camera); drawHUD(); }
  requestAnimationFrame(loop);
}
setTimeout(() => {
  buildMission(1, 'desert'); heli = newHeli(); game = { phase: 'board', t: 0, hits: 0, time: 0, aboard: 0, assaultT: 0, anim: 0, flares: 8 }; M.phaseT = 0;
  showMenu();
  window.__game = { get state() { return { mode, heli, game, M, SC, level }; }, keys, action, fireFlares, startMission, spawnJet, launchMissile, groundAt };
}, 60);
requestAnimationFrame(loop);
})();
