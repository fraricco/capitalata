<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Eli-Soccorso Milano</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9cc7ee; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; }
  #gl, #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #hud { pointer-events: none; z-index: 2; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,20,35,0.7); padding: 16px; z-index: 10; }
  #overlay.hidden { display: none; }
  .panel { background: rgba(20,35,60,0.86); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 26px 28px; max-width: 600px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); max-height: 100%; overflow: auto; }
  .panel h1 { font-size: 2.2rem; margin-bottom: 6px; }
  .panel h2 { font-size: 1.7rem; margin-bottom: 10px; }
  .panel p { opacity: 0.92; line-height: 1.5; margin-bottom: 12px; }
  .modes { display: flex; gap: 10px; margin: 14px 0; }
  .mode { flex: 1; border-radius: 10px; padding: 10px 6px; border: 2px solid rgba(255,255,255,0.2); font-size: 0.85rem; }
  .mode .e { font-size: 2rem; display: block; }
  .mode.on { border-color: #ffb347; background: rgba(255,179,71,0.18); }
  .mode.off { opacity: 0.45; }
  .keys { text-align: left; font-size: 0.92rem; background: rgba(0,0,0,0.28); border-radius: 10px; padding: 10px 14px; margin: 10px 0 16px; line-height: 1.75; }
  kbd { background: rgba(255,255,255,0.2); border-radius: 4px; padding: 1px 6px; font-family: inherit; font-size: 0.85em; }
  button.big { background: #ffb347; color: #1e3c72; font-weight: 700; font-size: 1.1rem; border: none; border-radius: 10px; padding: 12px 30px; cursor: pointer; margin: 4px; }
  button.big:hover { filter: brightness(1.08); }
  a.back { color: #fff; opacity: 0.7; display: inline-block; margin-top: 8px; font-size: 0.9rem; }
  .credit { font-size: 0.72rem; opacity: 0.6; margin-top: 10px; }
  table.sc { margin: 8px auto 14px; text-align: left; border-collapse: collapse; }
  table.sc td { padding: 3px 12px; } table.sc td:last-child { text-align: right; font-weight: 700; color: #ffd166; }
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  body.touch #touch { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.22); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
  .tb.p { background: rgba(255,179,71,0.6); }
  #bL { left: 12px; bottom: 28px; } #bR { left: 88px; bottom: 28px; }
  #bC { left: 12px; bottom: 104px; font-size: 0.8rem; } #bF { left: 88px; bottom: 104px; font-size: 0.8rem; }
  #bU { right: 88px; bottom: 28px; } #bD { right: 12px; bottom: 28px; }
  #bA { right: 12px; bottom: 104px; width: 84px; height: 84px; font-size: 0.8rem; font-weight: 700; background: rgba(46,160,67,0.55); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div class="tb" id="bL" data-k="left">◀</div><div class="tb" id="bR" data-k="right">▶</div>
  <div class="tb" id="bC" data-k="climb">SALI</div><div class="tb" id="bF" data-k="descend">SCENDI</div>
  <div class="tb" id="bU" data-k="up">▲</div><div class="tb" id="bD" data-k="down">▼</div>
  <div class="tb" id="bA" data-k="act">ATTERRA<br>/ DECOLLA</div>
</div>
<div id="overlay"><div class="panel" id="panel"><h2>Caricamento di Milano…</h2></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="milano-data.js"></script>
<script>
(() => {
'use strict';
const glc = document.getElementById('gl'), hudc = document.getElementById('hud');
const ctx = hudc.getContext('2d');
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
if (typeof THREE === 'undefined' || typeof window.MILANO === 'undefined') {
  panel.innerHTML = '<h2>Errore</h2><p>Impossibile caricare la libreria 3D o i dati della mappa. Controlla la connessione e ricarica la pagina.</p>';
  return;
}
const D = window.MILANO;

// ---------- costanti ----------
const SC = 4;                              // 1 metro reale = 4 unità di gioco
const WXu = D.WX * SC, WZu = D.WZ * SC;    // dimensioni mondo
const PADR = 58, HR = 30, GROUND_Y = 14, CEIL = 1500;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

// ---------- stato ----------
let mode = 'loading', level = 1, totalScore = 0;
let world = null, heli = null, game = null;
let vw = 800, vh = 600, tAnim = 0, shake = 0, toastMsg = '', toastT = 0;
const keys = { left: false, right: false, up: false, down: false, climb: false, descend: false };

const keymap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'climb', ShiftRight: 'climb', KeyR: 'climb', KeyE: 'climb', ControlLeft: 'descend', ControlRight: 'descend', KeyF: 'descend', KeyQ: 'descend' };
addEventListener('keydown', e => {
  if (e.code === 'Enter' || e.code === 'KeyL') { e.preventDefault(); if (!e.repeat) action(); return; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (mode === 'pause') { if (!e.repeat) togglePause(); return; }
    if (mode === 'play') { keys.climb = true; if (!e.repeat && heli.state === 'landed') action(); }
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (!e.repeat) togglePause(); return; }
  const k = keymap[e.code]; if (k) { keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') keys.climb = false; const k = keymap[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('p'); if (k === 'act') action(); else keys[k] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('p'); if (k !== 'act') keys[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
const isMobile = document.body.classList.contains('touch');
function toast(m, t = 2.4) { toastMsg = m; toastT = t; }

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(62, 1, 2, 9000);
let camYaw = 0;

// ---------- geometria 2D ----------
function pointInPoly(x, z, pl) {
  let c = false; const n = pl.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = pl[2 * i], zi = pl[2 * i + 1], xj = pl[2 * j], zj = pl[2 * j + 1];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function nearestOnPoly(x, z, pl) {
  let best = 1e18, bx = 0, bz = 0; const n = pl.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const ax = pl[2 * j], az = pl[2 * j + 1], ex = pl[2 * i] - ax, ez = pl[2 * i + 1] - az;
    const l2 = ex * ex + ez * ez; let t = l2 ? ((x - ax) * ex + (z - az) * ez) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = ax + ex * t, pz = az + ez * t, d2 = (x - px) * (x - px) + (z - pz) * (z - pz);
    if (d2 < best) { best = d2; bx = px; bz = pz; }
  }
  return { d2: best, x: bx, z: bz };
}

// ---------- preparazione città (una sola volta) ----------
const GC = 240;
const gkey = (cx, cz) => cx * 4096 + cz;
const BG = new Map(), TG = new Map();
const B = [];
const ALLTREES = [];
const PATHS = { roads: [], foot: [], sidewalk: [] };
let PARKS = [], WATER = [];
const ROADNAMES = [];

function gridAdd(map, x0, x1, z0, z1, item) {
  for (let cx = Math.floor(x0 / GC); cx <= Math.floor(x1 / GC); cx++) for (let cz = Math.floor(z0 / GC); cz <= Math.floor(z1 / GC); cz++) {
    const k = gkey(cx, cz); let a = map.get(k); if (!a) map.set(k, a = []); a.push(item);
  }
}
function gridQuery(map, x0, x1, z0, z1) {
  const out = new Set();
  for (let cx = Math.floor(x0 / GC); cx <= Math.floor(x1 / GC); cx++) for (let cz = Math.floor(z0 / GC); cz <= Math.floor(z1 / GC); cz++) {
    const a = map.get(gkey(cx, cz)); if (a) for (const it of a) out.add(it);
  }
  return out;
}
function makePath(flat, off) {
  const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push([flat[i] * SC, flat[i + 1] * SC]);
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1], off: off || 0 };
}
const _pa = { x: 0, z: 0, dx: 1, dz: 0 };
function pathAt(P, s, side) {
  s = clamp(s, 0, P.len); const c = P.cum;
  let lo = 1, hi = c.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (c[m] < s) lo = m + 1; else hi = m; }
  const i = lo, a = P.pts[i - 1], b = P.pts[i], L = (c[i] - c[i - 1]) || 1, t = (s - c[i - 1]) / L;
  const dx = (b[0] - a[0]) / L, dz = (b[1] - a[1]) / L;
  _pa.dx = dx; _pa.dz = dz;
  _pa.x = a[0] + (b[0] - a[0]) * t + (-dz) * side; _pa.z = a[1] + (b[1] - a[1]) * t + dx * side;
  return _pa;
}

function prepCity() {
  for (let n = 0; n < D.b.length; n++) {
    const r = D.b[n];                       // [h, wh, minh, flags, roof, col, rcol, outer, holes]
    const pl = Float32Array.from(r[7], v => v * SC);
    const rings = [pl]; for (const hole of r[8]) rings.push(Float32Array.from(hole, v => v * SC));
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, sa = 0, cx = 0, cz = 0;
    const m = pl.length / 2;
    for (let i = 0; i < m; i++) {
      const x = pl[2 * i], z = pl[2 * i + 1], x2 = pl[2 * ((i + 1) % m)], z2 = pl[2 * ((i + 1) % m) + 1];
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); sa += x * z2 - x2 * z; cx += x; cz += z;
    }
    const h = r[0] * SC, wh = r[1] * SC, minh = r[2] * SC, roof = r[4];
    const b = { pl, rings, h, wh, minh, ch: roof ? wh + (h - wh) * 0.5 : h, hosp: r[3] & 1, marble: (r[3] & 2) !== 0, roof, col: r[5], rcol: r[6],
      x0, x1, z0, z1, sa: sa / 2, cx: cx / m, cz: cz / m, id: n };
    B.push(b); gridAdd(BG, x0, x1, z0, z1, b);
  }
  PARKS = D.parks.map(f => Float32Array.from(f, v => v * SC));
  WATER = D.water.map(f => Float32Array.from(f, v => v * SC));
  const mk = (x, z, r) => ({ x, z, r, trunk: 12 + 0.5 * r, top: 12 + 2.2 * r, dead: false, col: pick(['#2f7d32', '#3a8f3e', '#2a7030', '#47a34b']) });
  for (const t of D.trees) ALLTREES.push(mk(t[0] * SC, t[1] * SC, rand(14, 20)));
  let extra = 0;
  for (const pk of PARKS) {
    if (extra > 3500) break;
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, sa = 0; const m = pk.length / 2;
    for (let i = 0; i < m; i++) { const x = pk[2 * i], z = pk[2 * i + 1], x2 = pk[2 * ((i + 1) % m)], z2 = pk[2 * ((i + 1) % m) + 1]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); sa += x * z2 - x2 * z; }
    const areaM = Math.abs(sa / 2) / (SC * SC); if (areaM < 1500) continue;
    const want = Math.min(300, Math.floor(areaM / 420));
    for (let k = 0, tries = 0; k < want && tries < want * 8; tries++) {
      const x = rand(x0, x1), z = rand(z0, z1);
      if (!pointInPoly(x, z, pk) || pointInBuilding(x, z)) continue;
      ALLTREES.push(mk(x, z, rand(14, 22))); k++; extra++;
    }
  }
  for (const t of ALLTREES) gridAdd(TG, t.x - t.r, t.x + t.r, t.z - t.r, t.z + t.r, t);
  for (const r of D.roads) {
    const p = makePath(r[2], 0); p.w = r[0] * SC; p.name = r[1];
    if (r[0] >= 9 && p.len > 200) PATHS.roads.push(p);
    if (r[1]) ROADNAMES.push(p);
    if (p.len > 120 && r[0] >= 5) { const q = makePath(r[2], 0); q.off = (r[0] / 2 + 1.8) * SC; PATHS.sidewalk.push(q); }
  }
  for (const f of D.foot) { const p = makePath(f[1], 0); if (p.len > 80) PATHS.foot.push(p); }
}
function insideB(b, x, z) {
  if (!pointInPoly(x, z, b.rings[0])) return false;
  for (let i = 1; i < b.rings.length; i++) if (pointInPoly(x, z, b.rings[i])) return false;
  return true;
}
function nearestB(b, x, z) {
  let best = nearestOnPoly(x, z, b.rings[0]);
  for (let i = 1; i < b.rings.length; i++) { const n = nearestOnPoly(x, z, b.rings[i]); if (n.d2 < best.d2) best = n; }
  return best;
}
function pointInBuilding(x, z) {
  const a = BG.get(gkey(Math.floor(x / GC), Math.floor(z / GC))); if (!a) return false;
  for (const b of a) if (x >= b.x0 && x <= b.x1 && z >= b.z0 && z <= b.z1 && insideB(b, x, z)) return true;
  return false;
}
function isClear(x, z, R) {
  if (x < R + 60 || z < R + 60 || x > WXu - R - 60 || z > WZu - R - 60) return false;
  for (const b of gridQuery(BG, x - R, x + R, z - R, z + R)) {
    if (x < b.x0 - R || x > b.x1 + R || z < b.z0 - R || z > b.z1 + R) continue;
    if (insideB(b, x, z) || nearestB(b, x, z).d2 < R * R) return false;
  }
  for (const w of WATER) if (pointInPoly(x, z, w)) return false;
  return true;
}
function findSpot(cx, cz, maxR) {
  const R = PADR + 45;
  for (let rad = 0; rad <= maxR; rad += 45) {
    const n = rad === 0 ? 1 : Math.max(6, Math.floor(2 * Math.PI * rad / 70));
    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad; if (isClear(x, z, R)) return { x, y: z }; }
  }
  return null;
}
function nearestStreet(x, z) {
  let best = 1e18, name = '';
  for (const p of ROADNAMES) for (let i = 0; i < p.pts.length; i++) {
    const dx = p.pts[i][0] - x, dz = p.pts[i][1] - z, d = dx * dx + dz * dz;
    if (d < best) { best = d; name = p.name; }
  }
  return name;
}

// ---------- livello ----------
function buildLevel(lv) {
  const w = { cars: [], peds: [], cones: [] };
  const hs = D.hosp.slice().sort(() => Math.random() - 0.5);
  let H = null;
  for (const h of hs) {
    const sp = findSpot(h.x * SC, h.z * SC, 900);
    if (sp) { H = { name: h.name, cx: h.x * SC, cz: h.z * SC, pad: sp }; break; }
  }
  if (!H) { const sp = findSpot(WXu / 2, WZu / 2, 3000); H = { name: 'Ospedale', cx: sp.x, cz: sp.y, pad: sp }; }
  const dx0 = H.cx - H.pad.x, dz0 = H.cz - H.pad.y, dl = Math.hypot(dx0, dz0) || 1;
  H.door = dl > 5 ? { x: H.pad.x + dx0 / dl * 90, y: H.pad.y + dz0 / dl * 90 } : { x: H.pad.x + 90, y: H.pad.y };
  w.hospital = H;
  let A = null;
  for (let pass = 0; pass < 2 && !A; pass++) {
    const lo = pass ? 1000 : 2000, hi = pass ? 6500 : 4400;
    for (let k = 0; k < 800; k++) {
      const x = rand(160, WXu - 160), z = rand(160, WZu - 160), d = Math.hypot(x - H.pad.x, z - H.pad.y);
      if (d < lo || d > hi) continue;
      if (isClear(x, z, PADR + 45)) { A = { pad: { x, y: z } }; break; }
    }
  }
  if (!A) A = { pad: findSpot(WXu * 0.7, WZu * 0.5, 4000) };
  A.patient = { x: A.pad.x + 92, y: A.pad.y + 14 };
  A.street = nearestStreet(A.pad.x, A.pad.y);
  w.accident = A;
  w.wreck = { x: A.pad.x - 95, y: A.pad.y - 85, a: 0.7 };
  for (let k = 0; k < 4; k++) w.cones.push({ x: A.pad.x + 70 + k * 18, y: A.pad.y - 70 + k * 16 });
  const nCars = 50 + lv * 8;
  for (let k = 0; k < nCars; k++) {
    const P = pick(PATHS.roads); if (!P) break;
    w.cars.push({ P, s: rand(0, P.len), dir: Math.random() < 0.5 ? 1 : -1, speed: rand(70, 130), lane: P.w * 0.22, x: 0, y: 0, vx: 1, vz: 0,
      color: pick(['#d94f4f', '#4f8fd9', '#e8c547', '#f2f2f2', '#3a3a3a', '#58b368', '#e08b3a', '#9aa0a6']), stop: 0, truck: Math.random() < 0.18 });
  }
  const nPeds = 24 + lv * 6;
  for (let k = 0; k < nPeds; k++) {
    const useFoot = PATHS.foot.length && Math.random() < 0.5, P = useFoot ? pick(PATHS.foot) : pick(PATHS.sidewalk); if (!P) break;
    w.peds.push({ P, s: rand(0, P.len), dir: Math.random() < 0.5 ? 1 : -1, speed: rand(14, 24), off: P.off, x: 0, y: 0, wait: 0, scared: 0, hit: 0,
      color: pick(['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#ecf0f1', '#1abc9c']) });
  }
  for (const t of ALLTREES) t.dead = false;
  for (const p of [H.pad, A.pad]) for (const t of gridQuery(TG, p.x - 130, p.x + 130, p.y - 130, p.y + 130)) if (Math.hypot(t.x - p.x, t.z - p.y) < PADR + 55 + t.r) t.dead = true;
  return w;
}

// ---------- texture ----------
const texCache = {};
function wallTex() {
  if (texCache.wall) return texCache.wall;
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#4a6078'; g.fillRect(14, 12, 36, 34);
  g.fillStyle = '#e9d38a'; g.fillRect(14, 12, 36, 6);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, 58, 64, 6);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return texCache.wall = t;
}
function glassTex() {
  if (texCache.glass) return texCache.glass;
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#5d7d96'; g.fillRect(0, 14, 64, 34);
  g.fillStyle = '#e4eef5'; g.fillRect(0, 30, 64, 3); g.fillRect(0, 14, 2, 34); g.fillRect(32, 14, 2, 34);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return texCache.glass = t;
}
function crossTexW() {
  if (texCache.cross) return texCache.cross;
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#d63a3a'; g.fillRect(24, 8, 16, 48); g.fillRect(8, 24, 48, 16);
  return texCache.cross = new THREE.CanvasTexture(c);
}

// ---------- mappa a terra ----------
const GH = 4096, GW = Math.round(GH * WXu / WZu);
let groundCanvas, groundTex, baseCanvas;
function drawBase() {
  baseCanvas = document.createElement('canvas'); baseCanvas.width = GW; baseCanvas.height = GH;

// ---------- collisioni ----------
function damage(nx, nz, pen, base, label) {
  heli.x += nx * pen; heli.z += nz * pen;
  const vn = heli.vx * nx + heli.vz * nz;
  if (vn < 0) { heli.vx -= 1.5 * vn * nx; heli.vz -= 1.5 * vn * nz; }
  if (heli.inv <= 0) {
    const d = Math.max(3, Math.min(40, Math.abs(vn) * 0.1 + base));
    heli.hull -= d; heli.inv = 0.9; shake = 0.35; game.hits++;
    toast(label + '!', 1.4);
    if (heli.hull <= 0) { heli.hull = 0; endGame(false, 'L\'elicottero è stato distrutto 💥'); }
  }
}
function collide() {
  const h = heli, hb = h.y - 14;
  for (const b of gridQuery(BG, h.x - HR - 10, h.x + HR + 10, h.z - HR - 10, h.z + HR + 10)) {
    if (hb >= b.ch || h.y + 16 < b.minh) continue;
    if (h.x < b.x0 - HR || h.x > b.x1 + HR || h.z < b.z0 - HR || h.z > b.z1 + HR) continue;
    const inside = insideB(b, h.x, h.z), n = nearestB(b, h.x, h.z);
    if (!inside && n.d2 >= HR * HR) continue;
    if (b.ch - hb < 14 && !b.roof) { h.y = b.ch + 14.5; if (h.vy < 0) h.vy = 0; continue; }
    const d = Math.sqrt(n.d2) || 0.001; let nx = (h.x - n.x) / d, nz = (h.z - n.z) / d, pen = HR - d;
    if (inside) { nx = -nx; nz = -nz; pen = HR + d; }
    damage(nx, nz, pen, 4, b.marble ? 'Duomo' : 'Edificio');
  }
  for (const t of gridQuery(TG, h.x - HR - 25, h.x + HR + 25, h.z - HR - 25, h.z + HR + 25)) {
    if (t.dead || hb >= t.top) continue;
    const dx = h.x - t.x, dz = h.z - t.z, rr = HR * 0.8 + t.r;
    if (Math.abs(dx) > rr || Math.abs(dz) > rr) continue;
    const d = Math.hypot(dx, dz);
    if (d < rr) { const n = d || 1; damage(dx / n, dz / n, rr - d, 2, 'Albero'); }
  }
  for (const c of world.cars) {
    if (hb >= (c.truck ? 26 : 18)) continue;
    const dx = h.x - c.x, dz = h.z - c.y, rr = HR + 16;
    if (Math.abs(dx) > rr || Math.abs(dz) > rr) continue;
    const d = Math.hypot(dx, dz);
    if (d < rr) { const n = d || 1; damage(dx / n, dz / n, rr - d, 3, 'Auto'); c.stop = 2.5; }
  }
  if (hb < 34) for (const p of world.peds) {
    if (p.scared > 0 || p.hit > 0) continue;
    if (Math.hypot(h.x - p.x, h.z - p.y) < HR + 6) {
      p.scared = 3; p.hit = 6; game.strikes++;
      toast(`Attento ai pedoni! (${game.strikes}/3)`, 2);
      if (game.strikes >= 3) endGame(false, 'Hai spaventato troppi pedoni 😱');
    }
  }
}

// ---------- aggiornamento logica ----------
let menuAng = 0;
function update(dt) {
  tAnim += dt;
  if (toastT > 0) toastT -= dt;
  if (shake > 0) shake -= dt;
  const h = heli;
  if (mode !== 'play') { h.rotS += dt * 20; if (mode === 'menu') menuAng += dt * 0.15; return; }
  game.t += dt;
  if (game.phase === 'toPatient' || game.phase === 'return') game.time -= dt;
  if (game.time <= 0) { game.time = 0; return endGame(false, game.phase === 'toPatient' ? 'Non sei arrivato in tempo sul luogo dell\'incidente ⏱️' : 'Il paziente non ce l\'ha fatta: tempo scaduto ⏱️'); }
  if (h.inv > 0) h.inv -= dt;

  let turn = 0;
  if (h.state === 'fly') {
    if (keys.left) turn -= 1; if (keys.right) turn += 1;
    h.a += turn * 2.2 * dt; h.yawRate = turn;
    const fx = Math.sin(h.a), fz = -Math.cos(h.a);
    let acc = 0; if (keys.up) acc = 300; else if (keys.down) acc = -190;
    h.vx += fx * acc * dt; h.vz += fz * acc * dt;
    const drag = Math.exp(-(acc ? 1.1 : 1.7) * dt); h.vx *= drag; h.vz *= drag;
    let ay = 0; if (keys.climb) ay += 160; if (keys.descend) ay -= 160;
    h.vy += ay * dt; h.vy *= Math.exp(-3 * dt);
    h.x += h.vx * dt; h.z += h.vz * dt; h.y += h.vy * dt;
    h.x = clamp(h.x, 40, WXu - 40); h.z = clamp(h.z, 40, WZu - 40);
    if (h.y > CEIL) { h.y = CEIL; if (h.vy > 0) h.vy = 0; }
    if (h.y < GROUND_Y + 1) { h.y = GROUND_Y + 1; if (h.vy < 0) h.vy = 0; }
    h.rotS += dt * 40;
    collide();
  } else if (h.state === 'landing') {
    h.vx *= Math.exp(-4 * dt); h.vz *= Math.exp(-4 * dt); h.yawRate = 0;
    h.x += (h.pad.x - h.x) * Math.min(1, 3 * dt); h.z += (h.pad.y - h.z) * Math.min(1, 3 * dt);
    h.y = Math.max(GROUND_Y, h.y - Math.max(45, (h.y - GROUND_Y) * 0.8) * dt); h.vy = 0; h.rotS += dt * 40;
    if (h.y <= GROUND_Y) { h.state = 'landed'; onLanded(); }
  } else if (h.state === 'takeoff') {
    h.y += 45 * dt; h.rotS += dt * 40; h.yawRate = 0;
    if (h.y >= 50) { h.y = 50; h.state = 'fly'; }
  } else { h.rotS += dt * 14; h.yawRate = 0; h.y = GROUND_Y; }

  const fwd = h.vx * Math.sin(h.a) + h.vz * -Math.cos(h.a);
  h.pitch += (clamp(fwd / 215, -1, 1) * 0.22 - h.pitch) * Math.min(1, 5 * dt);
  h.roll += (h.yawRate * 0.3 - h.roll) * Math.min(1, 5 * dt);

  if (game.phase === 'loading' || game.phase === 'unloading') {
    game.anim += dt / 3.8;
    if (game.anim >= 1) {
      if (game.phase === 'loading') { game.phase = 'return'; game.anim = 0; game.time = game.timeMax = 50; toast(`Paziente a bordo! 50 secondi per ${world.hospital.name} 🏥`, 4); }
      else endGame(true);
    }
  }
  for (const c of world.cars) {
    if (c.stop <= 0) { c.s += c.dir * c.speed * dt; if (c.s < 0) { c.s = 0; c.dir = 1; } else if (c.s > c.P.len) { c.s = c.P.len; c.dir = -1; } }
    else c.stop -= dt;
    const a = pathAt(c.P, c.s, c.dir * c.lane);
    c.x = a.x; c.y = a.z; c.vx = a.dx * c.dir; c.vz = a.dz * c.dir;
  }
  for (const p of world.peds) {
    if (p.hit > 0) p.hit -= dt;
    if (p.scared > 0) p.scared -= dt;
    else if (p.wait > 0) p.wait -= dt;
    else { p.s += p.dir * p.speed * dt; if (p.s < 0) { p.s = 0; p.dir = 1; p.wait = rand(0.3, 2); } else if (p.s > p.P.len) { p.s = p.P.len; p.dir = -1; p.wait = rand(0.3, 2); } }
    const a = pathAt(p.P, p.s, p.off); p.x = a.x; p.y = a.z;
  }
}
function onLanded() {
  if (game.phase === 'toPatient' && heli.pad === world.accident.pad) { game.phase = 'loading'; game.anim = 0; toast('I soccorritori stanno caricando il paziente…', 3.5); }
  else if (game.phase === 'return' && heli.pad === world.hospital.pad) { game.phase = 'unloading'; game.anim = 0; toast('Il paziente viene portato al pronto soccorso…', 3.5); }
  else if (game.phase === 'toPatient') toast('Questo è l\'ospedale: vai dove c\'è l\'incidente!');
  else if (game.phase === 'return') toast('Il paziente deve andare in ospedale!');
}

    camera.lookAt(h.x + Math.sin(camYaw) * 70, h.y - 4, h.z - Math.cos(camYaw) * 70);

}

  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Math.round(dist / SC) + ' m', cx, cy + 46);

  if (toastT > 0) {
    ctx.font = 'bold 17px sans-serif'; const w2 = Math.min(vw - 20, ctx.measureText(toastMsg).width + 34);
    ctx.globalAlpha = Math.min(1, toastT * 2); ctx.fillStyle = 'rgba(0,0,0,.72)'; rr(vw / 2 - w2 / 2, vh * 0.2, w2, 36, 18); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(toastMsg, vw / 2, vh * 0.2 + 24, w2 - 20); ctx.globalAlpha = 1;
  }
  const sp = Math.hypot(h.vx, h.vz);
  ctx.textAlign = 'center'; ctx.font = 'bold 18px sans-serif';
  if (h.state === 'fly') {
    const near = [world.hospital.pad, world.accident.pad].find(nearPad);
    if (near) { const ok = sp <= 90; ctx.fillStyle = ok ? '#7dff9a' : '#ffb347'; ctx.fillText(ok ? 'Premi L per atterrare' : 'Rallenta per atterrare… (' + Math.round(sp) + ')', vw / 2, vh - 130); }
  } else if (h.state === 'landed' && game.phase !== 'loading' && game.phase !== 'unloading') { ctx.fillStyle = '#7dff9a'; ctx.fillText('SPAZIO per decollare', vw / 2, vh - 130); }

  const tb = isMobile ? 190 : 24;
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 13px sans-serif';
  ctx.fillText(`Velocità ${Math.round(sp / SC * 3.6)} km/h`, pad, vh - tb);
  ctx.fillText(`Quota ${Math.max(0, Math.round((h.y - GROUND_Y) / SC))} m`, pad, vh - tb - 18);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('Mappa © OpenStreetMap', vw - pad, vh - 8);
  const mw = 110, mh = mw * miniCanvas.height / miniCanvas.width, mx = vw - mw - pad, my = pad, k = mw / WXu;
  ctx.fillStyle = 'rgba(8,18,32,.7)'; rr(mx - 4, my - 4, mw + 8, mh + 8, 8); ctx.fill();
  ctx.drawImage(miniCanvas, mx, my, mw, mh);
  const dot = (p, c, r) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(mx + p.x * k, my + p.y * k, r, 0, 7); ctx.fill(); };
  for (const hp of D.hosp) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(mx + hp.x * SC * k - 2, my + hp.z * SC * k - 2, 4, 4); }
  dot(world.hospital.pad, '#ff3b30', 4); dot(world.accident.pad, '#ffd60a', 4);
  ctx.save(); ctx.translate(mx + h.x * k, my + h.z * k); ctx.rotate(h.a); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-4, 4); ctx.lineTo(4, 4); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

// ---------- ciclo ----------
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(vw, vh, false);
  hudc.width = vw * dpr; hudc.height = vh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = vw / vh; camera.fov = vw / vh < 1 ? 75 : 62; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (world && SCN) { update(dt); updateScene(dt); renderer.render(SCN.sc, camera); drawHUD(); }
  requestAnimationFrame(loop);
}
setTimeout(() => {
  prepCity(); drawBase(); renderMini();
  groundTex = null; SCN = null;
  world = buildLevel(1); paintGround(world);
  SCN = buildStatic();
  setupLevelScene(world);
  heli = newHeli();
  game = { phase: 'toPatient', time: 50, timeMax: 50, t: 0, anim: 0, strikes: 0, hits: 0 };
  showMenu();
  window.__game = { get state() { return { mode, heli, game, world, level, SCN, B, ALLTREES }; }, keys, action, camera, startLevel };
}, 60);
requestAnimationFrame(loop);
})();
</script>
