<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="bUp" data-k="thUp">GAS +</div><div class="tb" id="bDn" data-k="thDn">GAS −</div><div class="tb" id="bBomb" data-k="bomb">BOMBA</div><div class="tb" id="bFire" data-k="fire">MISSILE</div><div class="tb" id="bCam" data-k="cam">CAM</div><div class="tb" id="bNuke" data-k="nuke">☢ ATOM.</div>
</div>
<div id="overlay"><div class="panel" id="panel"><h2>Caricamento della città…</h2></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const glc = document.getElementById('gl'), hudc = document.getElementById('hud'), ctx = hudc.getContext('2d');
const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');
if (typeof THREE === 'undefined') { panel.innerHTML = '<h2>Errore</h2><p>Impossibile caricare la libreria 3D. Controlla la connessione e ricarica la pagina.</p>'; return; }

// ---------- utilità ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

// ---------- città inventata: "Torrenia" ----------
const NBX = 22, NBZ = 18, CELL = 150, BLOCK = 120;
const CW = NBX * CELL, CD = NBZ * CELL;              // dimensioni (metri): 3300 x 2700
const bx0 = i => -CW / 2 + (i + 0.5) * CELL, bz0 = j => -CD / 2 + (j + 0.5) * CELL;
const riverZ = x => Math.sin(x / 520) * 180 + 380;   // il fiume attraversa la città da ovest a est
const GLASS = ['#7fb2d6', '#6fa5c4', '#8cc0d8', '#5e93b8', '#9ac4d6', '#6aa8a8'], CONC = ['#d8cfc0', '#cfc6b8', '#e3dccf', '#bdb4a6', '#d9c9b0', '#c9c2c8', '#e0d4c0'], DARK = ['#4a566a', '#3b4658', '#55606f', '#2f3a4a'];

const blocks = [], buildings = [], grid = new Map();
const gk = (i, j) => i * 64 + j;

    case 'pyramid': box(0, 0, w, d, 0, h * 0.8); cone(0, 0, Math.min(w, d) * 0.72, h * 0.8, h, 4, '#aab4c0'); break;

}
function genCity() {
  const cx0 = 0, cz0 = -160;
  for (let j = 0; j < NBZ; j++) for (let i = 0; i < NBX; i++) {
    const x = bx0(i), z = bz0(j), r = Math.hypot((x - cx0) / (CW / 2), (z - cz0) / (CD / 2));
    const blk = { i, j, x, z, kind: 'city', b: [], mesh: null };

    if (Math.abs(z - riverZ(x)) < 100) { blk.kind = 'river'; continue; }
    if (r > 0.1 && rnd() < 0.075) { blk.kind = 'park'; continue; }
    if (rnd() < 0.03) { blk.kind = 'plaza'; continue; }
    if (i === 10 && j === 5) { addBuilding(blk, x, z, 84, 84, 640, 'needle'); continue; }   // la Torre Torrenia, simbolo della città
    const base = 470 * Math.exp(-Math.pow(r / 0.36, 2)) + 85 * Math.exp(-Math.pow(r / 0.85, 2)) + 16;
    const hh = () => Math.max(10, base * (0.5 + 0.75 * rnd()));

    else { for (const dx of [-30, 30]) for (const dz of [-30, 30]) { if (rnd() < 0.12) continue; const s = R(34, 50); addBuilding(blk, x + dx, z + dz, s, s * R(0.8, 1.1), r > 0.65 ? R(10, 42) : hh() * 0.85, pick(types)); } }

// ---------- renderer e scena ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });

const camera = new THREE.PerspectiveCamera(65, 1, 1, 12000);
const scene = new THREE.Scene();
const HORIZON = '#cfe4f4';

const hemi = new THREE.HemisphereLight('#d6ebff', '#8a8272', 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff1d8', 0.85); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
const sc2 = sun.shadow.camera; sc2.left = -700; sc2.right = 700; sc2.top = 700; sc2.bottom = -700; sc2.near = 10; sc2.far = 3000; sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);
// cielo a gradiente
{ const g = new THREE.SphereGeometry(9000, 24, 14), col = [], pos = g.attributes.position, top = new THREE.Color('#4a86d0'), hor = new THREE.Color(HORIZON), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) { const y = pos.getY(i) / 9000; c.copy(hor).lerp(top, Math.pow(clamp(y, 0, 1), 0.55)); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

// ---------- texture ----------
function winTex(kind) {

  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {

    if (kind === 'glass') { g.fillStyle = '#58788f'; g.fillRect(x, y + 10, 64, 40); g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(x, y + 28, 64, 3); g.fillRect(x, y + 10, 2, 40); g.fillRect(x + 32, y + 10, 2, 40); if (on) { h.fillStyle = lit[(i + j * 3) % lit.length]; h.fillRect(x + 2, y + 12, 60, 36); } }
    else { g.fillStyle = '#4a6078'; g.fillRect(x + 10, y + 10, 44, 38); g.fillStyle = '#e9d38a'; g.fillRect(x + 10, y + 10, 44, 6); g.fillStyle = 'rgba(0,0,0,.14)'; g.fillRect(x, y + 56, 64, 8); if (on) { h.fillStyle = lit[(i * 2 + j) % lit.length]; h.fillRect(x + 10, y + 10, 44, 38); } }

const WT = winTex('win'), GT = winTex('glass');
const MATS = {

  glass: new THREE.MeshLambertMaterial({ map: GT.map, emissiveMap: GT.em, emissive: '#000000', vertexColors: true }),
  plain: new THREE.MeshLambertMaterial({ vertexColors: true })

// ---------- geometria degli edifici (fusa per isolato) ----------
const UC = 24, VC = 16;    // una tessera di 4x4 finestre ogni 24 x 16 m
const _c = new THREE.Color();

function vert(o, x, y, z, nx, ny, nz, u, v, c) { o.pos.push(x - OFF.x, y - OFF.y, z - OFF.z); o.nor.push(nx, ny, nz); o.uv.push(u, v); o.clr.push(c.r, c.g, c.b); }

function addCyl(o, cx, cz, r, y0, y1, c) {

let TREES = [], TRM = [];
