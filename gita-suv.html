const TS = 200, TN = 33, TC = TS / TN;
const tiles = new Map(); const houseMats = [];

function houseTexture(seed) {

const WALL = ['#efe3c8', '#e9cf9a', '#f0d7c3', '#f4efe4', '#dcb98a', '#e8c4b0'];

// ---------- scena e camera ----------

// ---------- menu e ciclo ----------

  showPanel(`<h1>🚙 Gita in SUV</h1><p>Un viaggio senza fretta per strade che non finiscono mai: colline toscane, costiera, Dolomiti e laghi. Niente tempo, niente gare: guida e goditi il panorama.</p>
    <p style="margin-bottom:2px"><b>Colore del SUV</b></p><div class="opts" id="cO">${PAINT.map((p, i) => `<div class="sw ${i === paintIdx ? 'sel' : ''}" data-i="${i}" title="${p[0]}" style="background:${p[1]}"></div>`).join('')}</div>
    <p style="margin-bottom:2px"><b>Ora del giorno</b></p><div class="opts" id="tO">${TIMES.map((t, i) => `<button data-i="${i}" class="${i === timeIdx ? 'sel' : ''}">${t.ic} ${t.n}</button>`).join('')}</div>

    <kbd>M</kbd> radio (2 stazioni) · <kbd>R</kbd> rimettiti in strada · <kbd>P</kbd> pausa</div>
