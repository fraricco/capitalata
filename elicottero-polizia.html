<script>
(() => {
'use strict';
const glc = document.getElementById('gl'), hudc = document.getElementById('hud');

const overlay = document.getElementById('overlay'), panel = document.getElementById('panel');

const D = window.MILANO;
// ---------- costanti ----------

let HQ = null;
// ---------- stato ----------
let mode = 'loading', level = 1, totalScore = 0;
let heli = null, game = { phase: 'dispatch', t: 0, timeLeft: 150, hits: 0 }, world = { cars: [], peds: [], thieves: [], patrols: [], officers: [] };

const info = { street: '', sdist: 0, place: '', district: '', lm: '', lmd: 0, lat: 0, lon: 0, t: 0 };
const keys = { left: false, right: false, up: false, down: false, climb: false, descend: false };

const keymap = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'climb', ShiftRight: 'climb', KeyR: 'climb', KeyE: 'climb', ControlLeft: 'descend', ControlRight: 'descend', KeyF: 'descend', KeyQ: 'descend' };

addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('.tb').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('p'); if (k === 'act') action(); else if (k === 'time') cycleTime(); else keys[k] = true; };

const isMobile = document.body.classList.contains('touch');

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });

const camera = new THREE.PerspectiveCamera(62, 1, 2, 9000);
let camYaw = 0;

// ---------- geometria 2D ----------
function pointInPoly(x, z, pl) {

  for (let i = 0, j = n - 1; i < n; j = i++) {

function nearestOnPoly(x, z, pl) {

  for (let i = 0, j = n - 1; i < n; j = i++) {
    const ax = pl[2 * j], az = pl[2 * j + 1], ex = pl[2 * i] - ax, ez = pl[2 * i + 1] - az;
    const l2 = ex * ex + ez * ez; let t = l2 ? ((x - ax) * ex + (z - az) * ez) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;

// ---------- preparazione città (una sola volta) ----------
const GC = 240;
const gkey = (cx, cz) => cx * 4096 + cz;
const BG = new Map(), TG = new Map();
const B = [];
const ALLTREES = [];
const PATHS = { roads: [], foot: [], sidewalk: [] };
let PARKS = [], WATER = [];
const ROADNAMES = [];

function gridAdd(map, x0, x1, z0, z1, item) {
  for (let cx = Math.floor(x0 / GC); cx <= Math.floor(x1 / GC); cx++) for (let cz = Math.floor(z0 / GC); cz <= Math.floor(z1 / GC); cz++) {
    const k = gkey(cx, cz); let a = map.get(k); if (!a) map.set(k, a = []); a.push(item);
  }
}
function gridQuery(map, x0, x1, z0, z1) {
  const out = new Set();
  for (let cx = Math.floor(x0 / GC); cx <= Math.floor(x1 / GC); cx++) for (let cz = Math.floor(z0 / GC); cz <= Math.floor(z1 / GC); cz++) {
    const a = map.get(gkey(cx, cz)); if (a) for (const it of a) out.add(it);
  }

}
function makePath(flat, off) {
  const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push([flat[i] * SC, flat[i + 1] * SC]);
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1], off: off || 0 };
}
const _pa = { x: 0, z: 0, dx: 1, dz: 0 };
function pathAt(P, s, side) {

  let lo = 1, hi = c.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (c[m] < s) lo = m + 1; else hi = m; }

  const dx = (b[0] - a[0]) / L, dz = (b[1] - a[1]) / L;

  _pa.x = a[0] + (b[0] - a[0]) * t + (-dz) * side; _pa.z = a[1] + (b[1] - a[1]) * t + dx * side;
  return _pa;
}

function prepCity() {
  for (let n = 0; n < D.b.length; n++) {
    const r = D.b[n];                       // [h, wh, minh, flags, roof, col, rcol, outer, holes]
    const pl = Float32Array.from(r[7], v => v * SC);
    const rings = [pl]; for (const hole of r[8]) rings.push(Float32Array.from(hole, v => v * SC));
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, sa = 0, cx = 0, cz = 0;
    const m = pl.length / 2;

      const x = pl[2 * i], z = pl[2 * i + 1], x2 = pl[2 * ((i + 1) % m)], z2 = pl[2 * ((i + 1) % m) + 1];
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); sa += x * z2 - x2 * z; cx += x; cz += z;

    const b = { pl, rings, h, wh, minh, ch: roof ? wh + (h - wh) * 0.5 : h, hosp: r[3] & 1, marble: (r[3] & 2) !== 0, roof, col: r[5], rcol: r[6],

  WATER = D.water.map(f => Float32Array.from(f, v => v * SC));
  const mk = (x, z, r) => ({ x, z, r, trunk: 12 + 0.5 * r, top: 12 + 2.2 * r, dead: false, col: pick(['#2f7d32', '#3a8f3e', '#2a7030', '#47a34b']) });
  for (const t of D.trees) ALLTREES.push(mk(t[0] * SC, t[1] * SC, rand(14, 20)));
  let extra = 0;
  for (const pk of PARKS) {
    if (extra > 3500) break;
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, sa = 0; const m = pk.length / 2;
    for (let i = 0; i < m; i++) { const x = pk[2 * i], z = pk[2 * i + 1], x2 = pk[2 * ((i + 1) % m)], z2 = pk[2 * ((i + 1) % m) + 1]; x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); sa += x * z2 - x2 * z; }

}
function insideB(b, x, z) {

  return true;
}
function nearestB(b, x, z) {
  let best = nearestOnPoly(x, z, b.rings[0]);

  for (const b of gridQuery(BG, x - R, x + R, z - R, z + R)) {
    if (x < b.x0 - R || x > b.x1 + R || z < b.z0 - R || z > b.z1 + R) continue;
    if (insideB(b, x, z) || nearestB(b, x, z).d2 < R * R) return false;
  }
  for (const w of WATER) if (pointInPoly(x, z, w)) return false;

function findSpot(cx, cz, maxR) {

  for (let rad = 0; rad <= maxR; rad += 45) {

    for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, x = cx + Math.cos(a) * rad, z = cz + Math.sin(a) * rad; if (isClear(x, z, R)) return { x, y: z }; }

// ---------- texture ----------
const texCache = {};
function wallTex() {

  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#5d7d96'; g.fillRect(0, 14, 64, 34);
  g.fillStyle = '#e4eef5'; g.fillRect(0, 30, 64, 3); g.fillRect(0, 14, 2, 34); g.fillRect(32, 14, 2, 34);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;

}

  g.fillStyle = '#fff'; g.fillRect(0, 0, 64, 64); g.fillStyle = '#d63a3a'; g.fillRect(24, 8, 16, 48); g.fillRect(8, 24, 48, 16);
  return texCache.cross = new THREE.CanvasTexture(c);
}

// ---------- mappa a terra ----------
const GH = 4096, GW = Math.round(GH * WXu / WZu);
let groundCanvas, groundTex, baseCanvas;
function drawBase() {
  baseCanvas = document.createElement('canvas'); baseCanvas.width = GW; baseCanvas.height = GH;
  const g = baseCanvas.getContext('2d'); g.scale(GW / WXu, GH / WZu);

  }
  if (mode === 'menu') {
    const R = 320, cx = HQ.x, cz = HQ.y; camera.position.set(cx + Math.sin(menuAng) * R, 160, cz + Math.cos(menuAng) * R); camera.lookAt(cx, 40, cz);
  } else {
    camYaw += angDiff(camYaw, h.a) * Math.min(1, 2.8 * dt);
    const DD = 150, up = 62; let sx2 = 0, sy2 = 0; if (shake > 0) { sx2 = rand(-3, 3) * shake * 2; sy2 = rand(-3, 3) * shake * 2; }
    camera.position.set(h.x - Math.sin(camYaw) * DD + sx2, Math.max(h.y + up, 12) + sy2, h.z + Math.cos(camYaw) * DD);
    camera.lookAt(h.x + Math.sin(camYaw) * 70, h.y - 4, h.z - Math.cos(camYaw) * 70);
  }
}

// ---------- HUD ----------
function drawHUD() {
  ctx.clearRect(0, 0, vw, vh);
  if (!heli || mode === 'menu' || mode === 'loading') return;
  const pad = 12, h = heli, sp = Math.hypot(h.vx, h.vz), act = world.thieves.filter(t => t.state !== 'arrested');
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const ph = 92 + world.thieves.length * 34;
  ctx.fillStyle = 'rgba(8,18,40,.7)'; rr(pad, pad, 262, ph, 12); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`🚔 Caso ${level}   ⭐ ${totalScore}`, pad + 12, pad + 22);
  bar(pad + 12, pad + 32, 238, 11, h.hull / 100, h.hull > 50 ? '#4cd964' : h.hull > 25 ? '#ffcc00' : '#ff3b30', '🔧 Elicottero');
  const tl = game.timeLeft; ctx.fillStyle = tl < 30 ? '#ff6b5e' : '#ffd166'; ctx.font = 'bold 13px sans-serif'; ctx.fillText(`⏱️ ${Math.floor(tl / 60)}:${String(Math.floor(tl % 60)).padStart(2, '0')}`, pad + 190, pad + 22);
  let y = pad + 70;
  for (const T of world.thieves) {
    const lab = T.state === 'robbing' ? 'In attesa di allarme' : T.state === 'arrested' ? '✅ Arrestato' : T.state === 'stopped' ? '🚔 Arresto in corso…' : T.state === 'stopping' ? 'Bloccato!' : T.called ? '🚔 Pattuglie in inseguimento' : (T.vis ? '🔦 Nel faro: agganciando…' : 'Aggancio');
    const f = T.state === 'arrested' || T.called ? 1 : T.lock / lockNeed();
    bar(pad + 12, y, 238, 11, f, T.called ? '#3d8bff' : T.vis ? '#ffd166' : '#8a93a6', `${T.id ? '🚗 Auto 2' : '🚗 Auto nera'} · ${lab}`); y += 34;
  }
  const near = info.sdist < 45 ? info.street : (info.street ? 'Presso ' + info.street : '');
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '12px sans-serif'; ctx.fillText('📍 ' + (info.place || near || '—'), pad + 12, pad + ph - 8, 238);
  // bersaglio: bussola e dati
  const tgt = act.slice().sort((a, b) => a.dist - b.dist)[0];
  if (tgt) {
    const dx = tgt.x - h.x, dz = tgt.z - h.z, dist = Math.hypot(dx, dz), rel = Math.atan2(dx, -dz) - h.a, cx = vw / 2, cy = pad + 40;
    ctx.fillStyle = 'rgba(8,18,40,.65)'; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rel); ctx.fillStyle = tgt.vis ? '#ffd166' : '#ff5a4a'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(-12, 12); ctx.lineTo(0, 6); ctx.lineTo(12, 12); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(Math.round(dist / SC) + ' m', cx, cy + 46);
    if (tgt.state === 'flee' || tgt.state === 'stopping') { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '11px sans-serif'; ctx.fillText(Math.round(tgt.curSpeed / SC * 3.6) + ' km/h', cx, cy + 60); }
    if (tgt.far > 0.5 && tgt.far < 9) { ctx.fillStyle = Math.floor(tAnim * 5) % 2 ? '#ff4030' : '#ffd0c8'; ctx.font = 'bold 16px sans-serif'; ctx.fillText(`⚠ STAI PERDENDO IL SOSPETTO ${Math.ceil(9 - tgt.far)}`, cx, cy + 86); }
  }
  // allarme / toast
  ctx.textAlign = 'center';
  if (alertT > 0) { ctx.font = 'bold 26px sans-serif'; ctx.globalAlpha = Math.min(1, alertT * 2); ctx.fillStyle = Math.floor(tAnim * 6) % 2 ? '#ff4a3a' : '#4a8bff'; ctx.fillText(alertMsg, vw / 2, vh * 0.32); ctx.globalAlpha = 1; }
  if (toastT > 0) { ctx.font = 'bold 15px sans-serif'; const w2 = Math.min(vw - 20, ctx.measureText(toastMsg).width + 34); ctx.globalAlpha = Math.min(1, toastT * 2); ctx.fillStyle = 'rgba(0,0,0,.72)'; rr(vw / 2 - w2 / 2, vh * 0.2, w2, 34, 17); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillText(toastMsg, vw / 2, vh * 0.2 + 22, w2 - 20); ctx.globalAlpha = 1; }
  if (h.state === 'landed') { ctx.fillStyle = '#7dff9a'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('SPAZIO per decollare', vw / 2, vh - 130); }
  ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = 'bold 13px sans-serif'; const tb = isMobile ? 190 : 24;
  ctx.fillText(`Velocità ${Math.round(sp / SC * 3.6)} km/h`, pad, vh - tb); ctx.fillText(`Quota ${Math.max(0, Math.round((h.y - GROUND_Y - surfaceAt(h.x, h.z).y) / SC))} m`, pad, vh - tb - 18);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('Mappa © OpenStreetMap', vw - pad, vh - 8);
  // radar
  const R = 72, rx = vw - R - pad - 4, ry = R + pad + 4, range = 1900;
  ctx.fillStyle = 'rgba(6,16,34,.74)'; ctx.beginPath(); ctx.arc(rx, ry, R + 4, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(120,170,255,.5)'; ctx.lineWidth = 1;
  for (const rad of [R, R * 0.66, R * 0.33]) { ctx.beginPath(); ctx.arc(rx, ry, rad, 0, 7); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(rx - R, ry); ctx.lineTo(rx + R, ry); ctx.moveTo(rx, ry - R); ctx.lineTo(rx, ry + R); ctx.stroke();
  const blip = (x, z, col, r) => { const ddx = x - h.x, ddz = z - h.z, a = -h.a, rx2 = ddx * Math.cos(a) - ddz * Math.sin(a), rz2 = ddx * Math.sin(a) + ddz * Math.cos(a); let px = rx2 / range * R, pz = rz2 / range * R; const l = Math.hypot(px, pz); if (l > R - 3) { px *= (R - 3) / l; pz *= (R - 3) / l; } ctx.fillStyle = col; ctx.beginPath(); ctx.arc(rx + px, ry + pz, r, 0, 7); ctx.fill(); };
  for (const p of world.patrols) blip(p.x, p.z, Math.floor(tAnim * 6) % 2 ? '#ff4a3a' : '#4a8bff', 3.5);
  for (const T of world.thieves) if (T.state !== 'arrested') blip(T.x, T.z, '#ff3b30', 5);
  blip(HQ.x, HQ.y, '#ffd166', 3);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(rx, ry - 7); ctx.lineTo(rx - 5, ry + 5); ctx.lineTo(rx + 5, ry + 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('RADAR', rx, ry + R + 16);
  if (h.hull < 30) { const g = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.35, vw / 2, vh / 2, vh * 0.8); g.addColorStop(0, 'rgba(255,0,0,0)'); g.addColorStop(1, `rgba(255,0,0,${0.3 + 0.12 * Math.sin(tAnim * 6)})`); ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh); }
}

// ---------- ciclo ----------
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  vw = innerWidth; vh = innerHeight;
  renderer.setPixelRatio(dpr); renderer.setSize(vw, vh, false);
  hudc.width = vw * dpr; hudc.height = vh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.aspect = vw / vh; camera.fov = vw / vh < 1 ? 75 : 62; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (SCN && heli) { update(dt); updateScene(dt); renderer.render(SCN.sc, camera); drawHUD(); }
  requestAnimationFrame(loop);
}
setTimeout(() => {
  prepCity(); prepStreets(); prepNet();
  HQ = findSpot(toX(HQ_LL[1]), toZ(HQ_LL[0]), 900) || { x: toX(HQ_LL[1]), y: toZ(HQ_LL[0]) };
  drawBase(); renderMini(); groundTex = null;
  SCN = buildStatic(); SCN.mis = null;
  world = buildDynamic(); setupDynamicScene(world);
  clearMission();
  heli = { x: HQ.x, y: GROUND_Y, z: HQ.y, vx: 0, vz: 0, vy: 0, a: 0, state: 'landed', landY: GROUND_Y, kind: 'ground', hull: 100, inv: 0, pitch: 0, roll: 0, rotS: 0, yawRate: 0 };
  showMenu();
  window.__game = { step: (n, dt) => { for (let i = 0; i < n; i++) { update(dt); updateScene(dt); } }, get state() { return { mode, heli, game, world, level, info, SCN, HQ }; }, keys, action, startMission, callUnits, NET, netNear };
}, 60);
requestAnimationFrame(loop);
})();
</script>
