<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dominio Mondiale</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg1: #0b1a2a; --bg2: #16304f; --ocean: #0b1f33; --panel: rgba(255,255,255,0.07); --border: rgba(255,255,255,0.18); --gold: #ffb347; --text: #eef4fb; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2)); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; background: var(--gold); color: #10233a; font-weight: 700; padding: 9px 14px; font-size: 0.9rem; transition: filter .15s; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.ghost { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: #e05263; color: #fff; }
  button.good { background: #4fb286; color: #07251a; }
  button.small { padding: 5px 9px; font-size: 0.78rem; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 8px 14px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: 0 0 auto; }
  .brand { font-weight: 800; font-size: 1.15rem; white-space: nowrap; } .brand span { color: var(--gold); }
  .stats { display: flex; gap: 16px; flex: 1; flex-wrap: wrap; align-items: center; }
  .stat { display: flex; flex-direction: column; line-height: 1.15; } .stat b { font-size: 0.98rem; } .stat i { font-style: normal; opacity: .6; font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; }
  .speed { display: flex; gap: 4px; } .speed button { padding: 6px 10px; min-width: 38px; font-size: .82rem; background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid var(--border); } .speed button.on { background: var(--gold); color: #10233a; }
  main { flex: 1; display: flex; min-height: 0; position: relative; }
  .mapwrap { flex: 1; position: relative; /*mappa a tutto schermo*/ background: radial-gradient(ellipse at center, #123352 0%, var(--ocean) 100%); overflow: hidden; touch-action: none; }
  svg#map { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
  svg#map.armata { cursor: crosshair; }
  .side { position: absolute; right: 0; top: 0; bottom: 0; width: 340px; max-width: 94%; display: none; flex-direction: column; border-left: 1px solid var(--border); background: rgba(8,20,34,.95); z-index: 8; }
  .side.open { display: flex; }
  .side .scroll { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
  .log { position: absolute; left: 10px; bottom: 10px; width: min(380px, 70%); max-height: 130px; overflow: hidden; padding: 6px 10px; font-size: .76rem; line-height: 1.4; background: rgba(8,20,34,.72); border: 1px solid var(--border); border-radius: 8px; pointer-events: none; }
  .log div { padding: 1px 0; opacity: .85; } .log .big { color: #ffd27d; font-weight: 700; opacity: 1; } .log .bad { color: #ff9d9d; opacity: 1; } .log .good { color: #86e6b4; opacity: 1; } .log .dip { color: #9fd4ff; }
  .abar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); align-items: center; gap: 8px; background: rgba(8,20,34,.95); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; z-index: 7; white-space: nowrap; }
  .stat[data-ui] { cursor: pointer; padding: 4px 9px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,.06); } .stat[data-ui]:hover { background: rgba(255,255,255,.14); } .stat[data-ui].on { border-color: var(--gold); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .card h3 { font-size: 1rem; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; } .card h4 { font-size: .8rem; opacity: .75; margin: 8px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; justify-content: space-between; font-size: .85rem; padding: 2px 0; } .row span:first-child { opacity: .7; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255,255,255,.5); }
  .bar { height: 8px; background: rgba(255,255,255,.12); border-radius: 5px; overflow: hidden; margin: 3px 0 6px; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4fb286, #ffb347); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; } .tag.war { background: rgba(224,82,99,.3); color: #ff9d9d; } .tag.peace { background: rgba(110,231,168,.2); color: #86e6b4; } .tag.me { background: rgba(255,179,71,.25); color: #ffd27d; }
  .hint { font-size: .78rem; opacity: .65; line-height: 1.4; }
  .zoombox { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; } .zoombox button { width: 34px; height: 34px; padding: 0; font-size: 1.1rem; background: rgba(8,20,34,.85); color: var(--text); border: 1px solid var(--border); }
  .tip { position: absolute; pointer-events: none; background: rgba(8,20,34,.95); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: .78rem; opacity: 0; transition: opacity .1s; z-index: 5; line-height: 1.35; }
  .toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(8,20,34,.95); border: 1px solid var(--border); color: #ffd27d; padding: 9px 15px; border-radius: 10px; font-size: .85rem; max-width: 82%; text-align: center; opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 6; } .toast.on { opacity: 1; }
  .overlay { position: fixed; inset: 0; background: rgba(4,10,18,.82); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 50; } .overlay.hidden { display: none; }
  .modal { background: linear-gradient(135deg, #12304e, #0d2237); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 640px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.55); max-height: 92vh; overflow-y: auto; }
  .modal h2 { font-size: 1.8rem; margin-bottom: 8px; } .modal p { line-height: 1.55; margin-bottom: 10px; font-size: .93rem; } .modal ul { margin: 0 0 12px 18px; font-size: .88rem; line-height: 1.55; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 6px; max-height: 190px; overflow-y: auto; margin: 8px 0 12px; padding-right: 4px; }
  .pick button { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border); text-align: left; font-size: .8rem; padding: 6px 8px; } .pick button.sel { background: var(--gold); color: #10233a; }
  .pick button small { display: block; opacity: .65; font-weight: 400; font-size: .68rem; }
  .diffs { display: flex; gap: 8px; margin: 8px 0 14px; } .diffs button { flex: 1; background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--border); } .diffs button.sel { background: var(--gold); color: #10233a; }
  .path { stroke-width: .9; stroke-linejoin: round; cursor: pointer; } .path:hover { filter: brightness(1.22); } .path.sel { filter: brightness(1.4); }
  .lbl { font-weight: 700; fill: rgba(255,255,255,.88); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.6); }
  .armtx { font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.7); }
  @media (max-width: 900px) { .stat.opt { display: none; } .log { width: 60%; max-height: 90px; } }
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" style="color:inherit;text-decoration:none;opacity:.75;font-size:.85rem;white-space:nowrap">&larr; Giochi</a>
  <div class="brand">🌍 Dominio <span>Mondiale</span></div>
  <div class="stats" id="stats"></div>
  <div class="speed" id="speed"></div>
</header>
<main>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet"><g id="cam"><g id="gC"></g><g id="gOcc"></g><g id="gLbl"></g><g id="gOrd"></g><g id="gArm"></g></g></svg>
    <div class="zoombox"><button id="zIn">+</button><button id="zOut">&minus;</button><button id="zReset">⌂</button></div>
    <div class="log" id="log"></div><div class="abar" id="abar" style="display:none"></div><div class="tip" id="tip"></div><div class="toast" id="toast"></div>
  </div>
  <aside class="side" id="side"><div class="scroll" id="panel"></div></aside>
</main>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="mondo-data.js"></script>
<script>
"use strict";
if (!window.MONDO) { document.getElementById('modal').innerHTML = '<h2>Errore</h2><p>Impossibile caricare i dati della mappa. Ricarica la pagina.</p>'; throw new Error('dati mancanti'); }
const M = window.MONDO, W = M.W, H = M.H;
const NS = 'http://www.w3.org/2000/svg';

/* ======================= COSTANTI ======================= */
const COST_K = 1.2;        // mld $ per arruolare 1.000 soldati
const UPKEEP_K = 0.055;    // mld $ al mese per 1.000 soldati
const BUDGET = 0.005;      // quota mensile del PIL che diventa bilancio statale
const MAN_FRAC = 0.012;    // quota della popolazione richiamabile
const MAN_RATE = 0.02;     // rigenerazione mensile dei richiamabili
const ADDEST = 2;          // mesi di addestramento
const VEL_ARM = 55;        // unita' di mappa percorse in un mese
const R_SCONTRO = 9, K_SCONTRO = 4.5, OCC_BASE = 0.8, MIN_ARM = 300, ATTR = 0.014;
const MS_MESE = 6000, VELS = [0, 1, 2, 4, 8];
const SOGLIA = 0.75;       // quota di paesi di un continente per "dominarlo"
const CONT = ['Europa', 'Asia', 'Africa', 'Nord America', 'Sud America', 'Oceania'];
const DIFFS = { facile: { lab: 'Facile', garr: 0.75, ia: 0.6, tregua: 30, eco: 1.15 }, normale: { lab: 'Normale', garr: 1, ia: 1, tregua: 18, eco: 1 }, difficile: { lab: 'Difficile', garr: 1.3, ia: 1.6, tregua: 10, eco: 0.95 } };
const MESI = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];

/* ======================= UTILITA' ======================= */
const rnd = Math.random, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nf = n => Math.round(n).toLocaleString('it-IT');
const nk = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'M' : n >= 1000 ? Math.round(n / 1000) + 'k' : String(Math.round(n));
const money = b => Math.abs(b) >= 1000 ? (b / 1000).toFixed(2).replace('.', ',') + ' mila mld $' : b.toFixed(Math.abs(b) < 10 ? 2 : 1).replace('.', ',') + ' mld $';
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
const $ = id => document.getElementById(id);

/* ======================= GRIGLIA DEI PAESI ======================= */
const IDS = M.c.map(c => c.id), IDX = {}; IDS.forEach((id, i) => IDX[id] = i);
const GRW = Math.ceil(W), GRH = Math.ceil(H), GRID = new Int16Array(GRW * GRH).fill(-1);
(function raster() {
  M.c.forEach((c, ci) => {
    const edges = []; let miny = 1e9, maxy = -1e9;
    for (const r of c.r) for (let i = 0; i < r.length; i += 2) { const j = (i + 2) % r.length, x1 = r[i], y1 = r[i + 1], x2 = r[j], y2 = r[j + 1]; miny = Math.min(miny, y1); maxy = Math.max(maxy, y1); if (y1 !== y2) edges.push([x1, y1, x2, y2]); }
    for (let y = Math.max(0, Math.floor(miny)); y <= Math.min(GRH - 1, Math.ceil(maxy)); y++) {
      const yc = y + 0.5, xs = []; for (const e of edges) if ((e[1] <= yc && e[3] > yc) || (e[3] <= yc && e[1] > yc)) xs.push(e[0] + (yc - e[1]) * (e[2] - e[0]) / (e[3] - e[1]));
      xs.sort((a, b) => a - b); for (let k = 0; k + 1 < xs.length; k += 2) { const x0 = Math.max(0, Math.ceil(xs[k] - 0.5)), x1 = Math.min(GRW - 1, Math.floor(xs[k + 1] - 0.5)); for (let x = x0; x <= x1; x++) GRID[y * GRW + x] = ci; }
    }
  });
})();
function countryAt(x, y) { const ix = Math.floor(x), iy = Math.floor(y); if (ix < 0 || iy < 0 || ix >= GRW || iy >= GRH) return null; const v = GRID[iy * GRW + ix]; return v < 0 ? null : IDS[v]; }

/* ======================= STATO ======================= */
const G = { fase: 'setup', diff: 'normale', t: 0, vel: 1, me: null, C: {}, F: {}, arm: [], seq: 1, selC: null, selA: null, log: [], offers: [], own: {}, ownDirty: true, vittoria: null, threat: 0, lastCoal: 0, res: null, ui: null };
const newRes = () => ({ lv: { arm: 0, log: 0, eco: 0, dip: 0 }, p: { arm: 0, log: 0, eco: 0, dip: 0 }, cur: null });
G.res = newRes();
const TECH = { arm: { n: 'Armamenti', d: '+12% di forza in combattimento per livello', cost: [12, 30, 70] }, log: { n: 'Logistica', d: '−25% logoramento in territorio ostile e +10% velocità per livello', cost: [10, 25, 60] }, eco: { n: 'Economia di guerra', d: '−10% costo delle reclute per livello', cost: [8, 22, 55] }, dip: { n: 'Diplomazia', d: '+8% probabilità di ottenere il transito per livello', cost: [8, 20, 50] } };
const rpMese = fid => gdpOf(fid) * 0.0008;
const techMul = fid => fid === G.me ? 1 + 0.12 * G.res.lv.arm : 1;
const costK = fid => COST_K * (fid === G.me ? 1 - 0.1 * G.res.lv.eco : 1);
let logDirty = true, panelDirty = true;
const anno = () => 2025 + Math.floor(G.t / 12), mese = () => Math.floor(G.t % 12);
const C = id => G.C[id], F = id => G.F[id];
const contIds = {}; CONT.forEach(k => contIds[k] = M.c.filter(c => c.k === k).map(c => c.id));

function ownedBy(fid) { if (G.ownDirty) { G.own = {}; for (const id of IDS) { const o = G.C[id].owner; (G.own[o] = G.own[o] || []).push(G.C[id]); } G.ownDirty = false; } return G.own[fid] || []; }
const armiesOf = fid => G.arm.filter(a => a.owner === fid);
const troopsOf = fid => armiesOf(fid).reduce((t, a) => t + a.n, 0);
const queueOf = fid => F(fid).queue.reduce((t, q) => t + q.n, 0);
function income(fid) { return ownedBy(fid).reduce((t, c) => t + c.gdp * BUDGET * (1 - 0.55 * c.unrest), 0) * DIFFS[G.diff].eco * (fid === G.me ? 1 : 1); }
function overext(fid) { const n = ownedBy(fid).length; return 1 + 0.02 * Math.max(0, n - 12) + 0.04 * Math.max(0, n - 30); }
function upkeep(fid) { return (troopsOf(fid) + queueOf(fid) * 0.5) / 1000 * UPKEEP_K * overext(fid); }
function manpower(fid) { return ownedBy(fid).reduce((t, c) => t + c.man, 0); }
function gdpOf(fid) { return ownedBy(fid).reduce((t, c) => t + c.gdp, 0); }
function strength(fid) { return troopsOf(fid) + queueOf(fid) * 0.5 + ownedBy(fid).reduce((t, c) => t + c.garr * 0.6, 0); }
const worldGdp = () => IDS.reduce((t, id) => t + G.C[id].gdp, 0);
function fName(fid) { const f = F(fid), n = ownedBy(fid).length; return n > 4 ? 'Impero ' + C(f.cap).n : C(f.cap) ? C(f.cap).n : f.name; }
const maxGarr = c => (6000 * Math.sqrt(c.pop) + c.gdp * 8) * 0.55 * DIFFS[G.diff].garr;
const resist = c => 3000 * Math.sqrt(c.pop) + 3000;

function log(txt, cls) { G.log.unshift({ a: anno(), m: mese(), txt, cls: cls || '' }); if (G.log.length > 200) G.log.pop(); logDirty = true; }
let toastT = 0; function avvisa(txt) { const t = $('toast'); t.textContent = txt; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ======================= DIPLOMAZIA ======================= */
const inGuerra = (a, b) => a !== b && !!(F(a).war[b] !== undefined);
function relBase(a, b) { const ca = C(F(a).cap), cb = C(F(b).cap); let r = (hash(a < b ? a + b : b + a) - 0.5) * 0.6; r += (ca && cb && ca.k === cb.k) ? 0.12 : -0.05; if (ca && cb && ca.nb.includes(cb.id)) r -= 0.08; return r; }
function rel(a, b) { return clamp(relBase(a, b) + (F(a).rel[b] || 0), -1, 1); }
function addRel(a, b, d) { F(a).rel[b] = clamp((F(a).rel[b] || 0) + d, -1, 1); }
function pTransito(req, host, comprato) {
  let p = 0.5 + rel(host, req) * 0.55;
  const share = gdpOf(req) / worldGdp(); p -= clamp((share - 0.08) * 1.6, 0, 0.3);        // i giganti insospettiscono
  if (strength(req) > strength(host) * 3) p -= 0.08;
  return clamp(p + (comprato ? 0.38 : 0) + (req === G.me ? 0.08 * G.res.lv.dip : 0), 0.05, 0.95);
}
function chiediTransito(req, host, comprato) {
  const ok = rnd() < pTransito(req, host, comprato); F(req).tr[host] = { ok, until: G.t + (ok ? (comprato ? 18 : 10) : 5) };
  if (req === G.me) { if (ok) { log(`🤝 ${fName(host)} concede il transito alle nostre armate (${comprato ? '18' : '10'} mesi).`, 'dip'); avvisa(`🤝 ${fName(host)} ci lascia passare`); } else { log(`⛔ ${fName(host)} nega il transito alle nostre armate.`, 'bad'); avvisa(`⛔ ${fName(host)} nega il transito`); } }
  if (ok) addRel(host, req, 0.03);
  return ok;
}
function dichiaraGuerra(a, b, motivo) {
  if (a === b || inGuerra(a, b)) return; F(a).war[b] = G.t; F(b).war[a] = G.t; delete F(a).tr[b]; delete F(b).tr[a];
  addRel(b, a, -0.5); addRel(a, b, -0.2);
  for (const c of ownedBy(b)) for (const nid of c.nb) { const o = C(nid).owner; if (o !== a && o !== b && o !== F(b).id) addRel(o, a, -0.06); }   // i vicini si allarmano
  if (a === G.me) log(`⚔️ Abbiamo dichiarato guerra a ${fName(b)}${motivo ? ' (' + motivo + ')' : ''}.`, 'big');
  else if (b === G.me) { log(`⚔️ ${fName(a)} ci ha dichiarato guerra${motivo ? ' (' + motivo + ')' : ''}!`, 'bad'); avvisa(`⚔️ ${fName(a)} ci dichiara guerra!`); }
  else log(`⚔️ ${fName(a)} ha dichiarato guerra a ${fName(b)}.`, 'dip');
  panelDirty = true;
}
function faiPace(a, b) {
  if (!inGuerra(a, b)) return; delete F(a).war[b]; delete F(b).war[a]; addRel(a, b, 0.2); addRel(b, a, 0.2); F(a).pace = F(b).pace = G.t;
  if (a === G.me || b === G.me) log(`🕊️ Pace con ${fName(a === G.me ? b : a)}.`, 'good'); else log(`🕊️ ${fName(a)} e ${fName(b)} firmano la pace.`, 'dip');
  panelDirty = true;
}
function proponiPace(a, b) {   // a propone a b
  const mesi = G.t - F(a).war[b]; if (mesi < 3) return false;
  const sa = strength(a), sb = strength(b); let p = 0.12 + clamp((sa / (sb + 1) - 1) * 0.35, 0, 0.5) + Math.min(0.2, mesi / 120);
  if (sb < sa * 0.6) p += 0.25; if (rnd() < p) { faiPace(a, b); return true; } return false;
}

/* ======================= AVVIO PARTITA ======================= */
function palette(i) { return `hsl(${Math.round((i * 137.508) % 360)},52%,${44 + (i % 3) * 4}%)`; }
function startGame(pid, diff) {
  Object.assign(G, { fase: 'play', diff, t: 0, vel: 1, me: pid, C: {}, F: {}, arm: [], seq: 1, selC: pid, selA: null, log: [], offers: [], own: {}, ownDirty: true, vittoria: null, threat: 0, lastCoal: 0, res: newRes(), ui: null });
  const D = DIFFS[diff];
  M.c.forEach((c, i) => {
    const rc = { id: c.id, n: c.n, k: c.k, pop: c.pop, gdp: c.gdp, gdp0: c.gdp, lx: c.lx, ly: c.ly, nb: c.nb, owner: c.id, unrest: 0, occ: null, man: 0, maxMan: c.pop * 1e6 * MAN_FRAC, garr: 0 };
    rc.man = rc.maxMan * 0.7; rc.garr = maxGarr(rc) * 0.8; G.C[c.id] = rc;
    G.F[c.id] = { id: c.id, name: c.n, color: palette(i), cap: c.id, money: 0, queue: [], war: {}, rel: {}, tr: {}, aiT: rnd() * 4, alive: true, pace: -99 };
  });
  G.F[pid].color = '#ffb347'; G.ownDirty = true;
  for (const id of IDS) { const f = F(id); f.money = income(id) * (id === pid ? 10 : 4); }
  // armate iniziali: i paesi piu' ricchi partono con un esercito mobile
  [...M.c].sort((a, b) => b.gdp - a.gdp).slice(0, 70).forEach(c => { const rc = C(c.id); creaArmata(c.id, Math.max(MIN_ARM * 2, rc.garr * 0.9), rc.lx, rc.ly); });
  if (!armiesOf(pid).length) { const rc = C(pid); creaArmata(pid, Math.max(MIN_ARM * 3, rc.garr * 0.9), rc.lx, rc.ly); }
  log(`Comincia la partita: guidi ${C(pid).n}. Obiettivo: dominare 2 continenti.`, 'big');
  $('overlay').classList.add('hidden'); buildMap(); applyView(); paintMap(); panelDirty = true; logDirty = true;
}

/* ======================= ARMATE ======================= */

$('zIn').onclick = () => { const r = SVG.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.4); }; $('zOut').onclick = () => { const r = SVG.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.4); };
$('zReset').onclick = () => { view = { x: 0, y: 0, k: 1 }; clampView(); applyView(); };
addEventListener('keydown', e => { if (G.fase !== 'play') return; if (e.code === 'Space') { e.preventDefault(); G.vel = G.vel ? 0 : 1; syncSpeed(); } else if (e.code === 'Escape') { G.ui = null; G.selA = null; SVG.classList.remove('armata'); panelDirty = true; } else if ('12345'.includes(e.key)) { G.vel = +e.key - 1; syncSpeed(); } });
addEventListener('resize', () => { resizeMap(); clampView(); applyView(); });

/* ======================= MENU INIZIALE ======================= */
let scelto = null, diffScelta = 'normale';
function menuIniziale() {
  G.fase = 'setup'; G.vel = 0; syncSpeed(); const ord = [...M.c].sort((a, b) => b.gdp - a.gdp); scelto = scelto || 'ITA';
  $('modal').innerHTML = `<h2>🌍 Dominio Mondiale</h2><p>Guida un paese alla conquista del mondo. È un gioco <b>solo militare</b>: niente colpi di stato, solo eserciti.</p><ul><li><b>Recluta</b> truppe in qualunque tuo paese: costano denaro e richiamabili.</li><li>Le <b>armate vanno ovunque</b>, anche via mare. Clicca un'armata, poi la destinazione.</li><li>Attraversare un paese in pace richiede il <b>permesso di transito</b>: possono <b>negarlo</b>. Puoi comprarlo con un accordo.</li><li>Nei paesi <b>in guerra</b> con te le armate si <b>logorano</b>. Dichiara guerra per invadere.</li><li>I paesi conquistati si <b>ribellano</b> se non li presidi. Se diventi troppo grande, si forma una <b>coalizione</b>.</li><li><b>Vinci</b> dominando <b>2 continenti</b> (almeno il ${SOGLIA * 100}% dei loro paesi).</li></ul><b>Scegli il tuo paese</b><div class="pick" id="pick">${ord.map(c => `<button data-id="${c.id}" class="${c.id === scelto ? 'sel' : ''}">${c.n}<small>${c.k} · PIL ${money(c.gdp)}</small></button>`).join('')}</div><b>Difficoltà</b><div class="diffs" id="diffs">${Object.keys(DIFFS).map(k => `<button data-d="${k}" class="${k === diffScelta ? 'sel' : ''}">${DIFFS[k].lab}</button>`).join('')}</div><div class="btns"><button id="bStart">Inizia la conquista</button></div><p class="hint" style="margin-top:10px">Mappa: © Natural Earth (pubblico dominio). Ispirato a Dummynation.</p>`;
  $('overlay').classList.remove('hidden');
  $('pick').onclick = e => { const b = e.target.closest('button'); if (!b) return; scelto = b.dataset.id; $('pick').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); };
  $('diffs').onclick = e => { const b = e.target.closest('button'); if (!b) return; diffScelta = b.dataset.d; $('diffs').querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); };
  $('bStart').onclick = () => { startGame(scelto, diffScelta); view = { x: 0, y: 0, k: 1 }; G.vel = 1; syncSpeed(); resizeMap(); clampView(); applyView(); };
}

/* ======================= CICLO PRINCIPALE ======================= */
let last = performance.now(), uiT = 0;
function loop(now) {
  if (bordDirty) reorderPaths();
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (G.fase === 'play' && G.vel > 0) { const dtM = dt * 1000 / MS_MESE * VELS[G.vel], n = Math.max(1, Math.ceil(dtM / 0.05)); for (let i = 0; i < n; i++) tick(dtM / n); }
  if (G.fase === 'play' || G.fase === 'fine') { renderArmate(); uiT -= dt; if (uiT <= 0 || panelDirty || logDirty) { uiT = 0.3; renderStats(); if (panelDirty) { renderPanel(); panelDirty = false; } if (logDirty) { renderLog(); logDirty = false; } } }
  requestAnimationFrame(loop);
}
buildMapOnce();
function buildMapOnce() { G.C = {}; G.F = {}; M.c.forEach((c, i) => { G.C[c.id] = { id: c.id, n: c.n, k: c.k, owner: c.id, garr: 0, unrest: 0, occ: null, pop: c.pop, gdp: c.gdp, nb: c.nb, lx: c.lx, ly: c.ly, man: 0 }; G.F[c.id] = { id: c.id, color: '#3a5a7a', war: {}, tr: {}, rel: {}, queue: [], cap: c.id, alive: true }; }); buildMap(); paintMap(); resizeMap(); }
syncSpeed(); menuIniziale(); requestAnimationFrame(loop);
window.__dm = { paintMap, G, tick, startGame, creaArmata, ordina, dichiaraGuerra, faiPace, chiediTransito, countryAt, C, F, ownedBy, income, troopsOf, recluta, controllaVittoria, rivolta, view: () => view, clickMappa };
</script>
